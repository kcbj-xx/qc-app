<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QC Toolset Pro</title>
    
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1162/1162456.png">
    
    <link rel="manifest" href='data:application/manifest+json,%7B%22name%22%3A%22QC%20Toolset%20Pro%22%2C%22short_name%22%3A%22QC%20Tool%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f3f4f6%22%2C%22theme_color%22%3A%22%232563eb%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F1162%2F1162456.png%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D'>

    <style>
        :root { 
            --primary: #2563eb; 
            --primary-hover: #1d4ed8; 
            --bg: #f3f4f6; 
            --card-bg: #ffffff; 
            --text: #1f2937; 
            --border: #e5e7eb; 
            --accent: #d97706; 
            --success: #10b981;
            --error: #ef4444;
        }
        
        body { overscroll-behavior-y: contain; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .container { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 20px; padding-bottom: 30px; }
        .section-container { width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .divider { text-align: center; color: #94a3b8; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin: -5px 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .divider::before, .divider::after { content: ""; height: 1px; background-color: var(--border); flex: 1; }
        
        .card { background-color: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); position: relative; }
        
        .card h2 { 
            margin-top: 0; 
            border-bottom: 2px solid var(--border); 
            padding-bottom: 10px; 
            margin-bottom: 20px; 
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 12px; 
        }
        
        .card-title-text { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        .chevron { font-size: 0.8rem; color: #94a3b8; transition: transform 0.3s ease; justify-self: end;}
        
        .pin-btn {
            grid-column: 1;
            background: transparent !important;
            border: none !important;
            color: #cbd5e1;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            margin: 0;
            margin-left: -6px; 
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
            -webkit-appearance: none;
        }

        @media (hover: hover) {
            .pin-btn:hover { background: #f1f5f9 !important; color: #94a3b8; }
        }
        
        .pin-btn svg { pointer-events: none; transition: fill 0.2s; }
        .card.pinned .pin-btn { color: var(--accent); }
        .card.pinned .pin-btn svg { fill: var(--accent); }
        
        .card.collapsed h2 { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .card.collapsed .card-body { display: none; }
        .card.collapsed .chevron { transform: rotate(-90deg); }

        .footer-version { text-align: center; color: #94a3b8; font-size: 0.75rem; margin-top: 20px; }

        /* --- Folder Tabs --- */
        .tabs-container { 
            display: flex; 
            border-bottom: 2px solid var(--border); 
            margin-bottom: 15px; 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none; 
            scroll-behavior: smooth;
            align-items: flex-end; 
            padding-top: 15px; 
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tabs-list { 
            display: flex; 
            gap: 4px; 
            align-items: flex-end; 
            margin: 0; 
            padding: 0;
            margin-bottom: -2px; 
            position: relative;
        }
        .tab-btn { 
            margin: 0; 
            background: #f8fafc; 
            border: 1px solid var(--border); 
            border-bottom: none; 
            padding: 8px 16px; 
            border-radius: 8px 8px 0 0; 
            cursor: pointer; 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: #64748b; 
            white-space: nowrap; 
            transition: all 0.2s ease; 
            -webkit-tap-highlight-color: transparent;
            height: 38px; 
            box-sizing: border-box;
            line-height: 1.2;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation; /* Re-allows normal horizontal scrolling */
        }
        .tab-btn.active { 
            background: #ffffff; 
            color: var(--primary); 
            border-top: 3px solid var(--primary); 
            border-bottom: none; 
            height: 38px; 
            padding-top: 8px; 
            z-index: 2; 
        }
        .add-tab-btn { 
            margin: 0; 
            background: transparent; 
            color: #94a3b8; 
            border: none; 
            font-size: 1.5rem; 
            cursor: pointer; 
            padding: 0 15px; 
            font-weight: bold; 
            transition: color 0.2s; 
            -webkit-tap-highlight-color: transparent; 
            height: 38px; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 4px; 
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .add-tab-btn:hover { color: var(--primary); }

        /* --- Inline Tab Options Menu --- */
        .tab-options-panel {
            display: none; 
            flex-direction: column; 
            background: #f8fafc; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            margin-bottom: 15px;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .row { display: flex; gap: 15px; } .row .input-group { flex: 1; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 0.875rem; }
        
        input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; font-family: inherit; width: 100%; max-width: 100%; min-height: 46px; box-sizing: border-box; transition: border-color 0.3s ease; margin: 0; display: block; -webkit-appearance: none; appearance: none; }
        input.input-error { border: 2px solid var(--error); background-color: #fff1f2; }
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; -webkit-tap-highlight-color: transparent; margin-bottom: 8px; }
        button:hover { background-color: var(--primary-hover); }
        button.secondary { background-color: var(--error); width: 100%; margin-top: 10px; }
        
        .btn-timer-start { background-color: #8b5cf6; }
        .btn-timer-start:hover { background-color: #7c3aed; }
        .timer-display { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 2rem; font-weight: bold; margin-top: 10px; text-align: center; border: 2px solid #334155; transition: all 0.3s; }
        .timer-active { border-color: var(--success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .timer-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        .result { margin-top: 15px; padding: 15px; background-color: #f8fafc; border-radius: 8px; border: 1px solid var(--border); font-size: 1.1rem; text-align: center; }
        .pickup-pct { color: var(--accent); font-weight: 800; font-size: 1.3rem; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 15px 0; text-align: center; }
        .stat-box { background-color: #f8fafc; border: 1px solid var(--border); padding: 10px; border-radius: 8px; }
        .stat-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; font-weight: bold; }
        .stat-value { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        
        .drag-container { display: none; flex-direction: column; gap: 8px; margin: 15px 0; max-height: 350px; overflow-y: auto; overflow-x: hidden; border-radius: 8px; padding: 4px; }
        .number-item { display: flex; align-items: center; background: #fff; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; gap: 10px; position: relative; z-index: 1; -webkit-tap-highlight-color: transparent; }
        .number-item.dragging { z-index: 100; opacity: 0.9; }
        .drag-handle { color: #94a3b8; font-size: 1.5rem; cursor: grab; padding: 10px; margin-left: -5px; display: flex; align-items: center; user-select: none; -webkit-user-select: none; touch-action: none; transition: color 0.2s; -webkit-tap-highlight-color: transparent; }
        .drag-handle:active { cursor: grabbing; color: var(--primary); }
        .edit-input { flex: 1; border: 1px solid transparent; background: transparent; font-weight: 600; font-size: 1.1rem; padding: 4px; transition: border-color 0.2s; }
        .edit-input:focus { border-bottom: 2px solid var(--primary); outline: none; border-radius: 0; }
        .remove-btn { background: #fee2e2; color: #ef4444; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; padding: 0; line-height: 1; transition: background-color 0.2s; }
        .remove-btn:hover { background: #fecaca; }
        .last-added-text { font-size: 0.85rem; color: var(--success); font-weight: 600; margin-top: 5px; min-height: 1.2em; transition: color 0.3s; display: flex; justify-content: flex-start; align-items: center; }
        .btn-recursive { background-color: var(--success); margin-top: 8px; font-size: 0.95rem; }
        
        @media (max-width: 480px) { .row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div id="pinned-section" class="section-container" style="display: none;"></div>
    <div id="pinned-divider" class="divider" style="display: none;">Tools</div>
    <div id="unpinned-section" class="section-container">
        
        <div class="card" id="card-pickup">
            <h2 onclick="toggleCard('card-pickup')">
                <button class="pin-btn" onclick="togglePin(event, 'card-pickup')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Pickup Calculator</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">

                <div class="tabs-container" id="pickupTabsContainer">
                    <div id="pickupTabsList" class="tabs-list"></div>
                </div>

                <div id="pickupTabOptionsPanel" class="tab-options-panel">
                    <label style="margin-bottom: 5px; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Manage Sample</label>
                    <div style="display:flex; gap:10px; width:100%; margin-bottom: 10px;">
                        <input type="text" id="renamePickupTabInput" placeholder="Sample Name" style="flex:1; min-height:40px; padding: 8px 12px; margin:0;">
                        <button onclick="savePickupTabName()" style="width:auto; min-height:40px; margin:0; padding:0 20px;">Save</button>
                    </div>
                    <button onclick="confirmDeletePickupTab()" class="secondary" style="margin:0; min-height:40px;">Delete Sample</button>
                </div>

                <form onsubmit="event.preventDefault();">
                    <div class="row">
                        <div class="input-group">
                            <label>Pre-sample</label>
                            <input type="number" step="any" id="preSampleVal" inputmode="decimal" oninput="savePickupInputs()">
                        </div>
                        <div class="input-group">
                            <label>Post-sample</label>
                            <input type="number" step="any" id="postSampleVal" inputmode="decimal" oninput="savePickupInputs()">
                        </div>
                    </div>
                </form>
                
                <div class="result" id="pickupResult" style="display: none; margin-top: 0;"></div>
                <button id="clearPickupBtn" class="secondary" onclick="resetPickup()" style="display: none; margin-top: 15px;">Clear Current Sample</button>
            </div>
        </div>

        <div class="card" id="card-averaging">
            <h2 onclick="toggleCard('card-averaging')">
                <button class="pin-btn" onclick="togglePin(event, 'card-averaging')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Sum & Averaging</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                
                <div class="tabs-container" id="tabsContainer">
                    <div id="tabsList" class="tabs-list"></div>
                </div>

                <div id="tabOptionsPanel" class="tab-options-panel">
                    <label style="margin-bottom: 5px; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Manage Sample</label>
                    <div style="display:flex; gap:10px; width:100%; margin-bottom: 10px;">
                        <input type="text" id="renameTabInput" placeholder="Sample Name" style="flex:1; min-height:40px; padding: 8px 12px; margin:0;">
                        <button onclick="saveTabName()" style="width:auto; min-height:40px; margin:0; padding:0 20px;">Save</button>
                    </div>
                    <button onclick="confirmDeleteTab()" class="secondary" style="margin:0; min-height:40px;">Delete Sample</button>
                </div>

                <div class="stats-grid">
                    <div class="stat-box"><div class="stat-label">Count</div><div class="stat-value" id="statCount">0</div></div>
                    <div class="stat-box"><div class="stat-label">Sum</div><div class="stat-value" id="statSum">0</div></div>
                    <div class="stat-box"><div class="stat-label">Avg</div><div class="stat-value" id="statAvg">0</div></div>
                </div>
                <div class="input-group">
                    <label>Add Number</label>
                    <form onsubmit="event.preventDefault(); addNumber();" style="display: flex; gap: 10px; width: 100%; margin: 0;">
                        <input type="number" step="any" id="numberInput" inputmode="decimal" placeholder="0.00" style="flex: 1;">
                        <button type="submit" style="width: auto; margin-bottom: 0;">Add</button>
                    </form>
                    <div class="last-added-text" id="lastAddedDisplay"></div>
                </div>
                <div id="numberList" class="drag-container"></div>
                <button id="clearAllBtn" class="secondary" onclick="clearNumbers()" style="display:none;">Clear Current Sample</button>
            </div>
        </div>

        <div class="card" id="card-salinity">
            <h2 onclick="toggleCard('card-salinity')">
                <button class="pin-btn" onclick="togglePin(event, 'card-salinity')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Salinity Calculator</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                <form onsubmit="event.preventDefault(); calculateSalinity();">
                    <div class="input-group">
                        <label>Brix Value</label>
                        <input type="number" step="any" id="brixVal" inputmode="decimal" placeholder="Enter Brix">
                    </div>
                    <button type="submit">Calculate Salinity</button>
                </form>
                <button id="clearSalinityBtn" class="secondary" onclick="resetSalinity()" style="display: none;">Clear</button>
                <div class="result" id="salinityResult" style="display: none;"></div>
            </div>
        </div>

        <div class="card" id="card-temp">
            <h2 onclick="toggleCard('card-temp')">
                <button class="pin-btn" onclick="togglePin(event, 'card-temp')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Temperature Converter</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                <form onsubmit="event.preventDefault();">
                    <div class="row">
                        <div class="input-group">
                            <label>Celsius (°C)</label>
                            <input type="number" step="any" id="celsiusVal" inputmode="decimal" placeholder="°C" oninput="convertTemp('C')">
                        </div>
                        <div class="input-group">
                            <label>Fahrenheit (°F)</label>
                            <input type="number" step="any" id="fahrenheitVal" inputmode="decimal" placeholder="°F" oninput="convertTemp('F')">
                        </div>
                    </div>
                </form>
                <button id="clearTempBtn" class="secondary" onclick="resetTemp()" style="display: none;">Clear</button>
            </div>
        </div>

        <div class="card" id="card-stopwatch">
            <h2 onclick="toggleCard('card-stopwatch')">
                <button class="pin-btn" onclick="togglePin(event, 'card-stopwatch')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Stopwatch</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                <div class="timer-display" id="stopwatchDisplay" style="margin-top: 0; margin-bottom: 15px;">00:00.00</div>
                <button id="holdTimerBtn" class="btn-timer-start" oncontextmenu="return false;" style="-webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; margin-bottom: 10px;">Hold to Time</button>
                <div style="display: flex; gap: 10px;">
                    <button id="toggleTimerBtn" onclick="toggleStopwatch()" style="margin: 0; flex: 1;">Start</button>
                    <button class="secondary" onclick="resetStopwatch()" style="margin: 0; flex: 1;">Reset</button>
                </div>
            </div>
        </div>

        <div class="card" id="card-sampling">
            <h2 onclick="toggleCard('card-sampling')">
                <button class="pin-btn" onclick="togglePin(event, 'card-sampling')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Sampling Time</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                <form onsubmit="event.preventDefault(); generateTime(false);">
                    <div class="row">
                        <div class="input-group">
                            <label>Min Mins</label>
                            <input type="number" id="minMinutes" placeholder="e.g. 40" inputmode="numeric">
                        </div>
                        <div class="input-group">
                            <label>Max Mins</label>
                            <input type="number" id="maxMinutes" placeholder="e.g. 60" inputmode="numeric">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Start Time</label>
                        <input type="time" id="startTime">
                    </div>
                    <button type="submit">Generate Time</button>
                </form>
                <div id="timeResult" class="result" style="display: none;"></div>
                <div id="timerControls" style="display: none; margin-top: 15px;">
                    <button class="btn-timer-start" onclick="handleStartTimer()">Start Countdown</button>
                </div>
                <div id="activeTimer" style="display: none; margin-top: 15px;">
                    <div class="timer-label">Time Remaining</div>
                    <div class="timer-display" id="countdown">00:00:00</div>
                    <button class="secondary" id="stopAlarmBtn" onclick="stopTimer()" style="display: none;">Stop Alarm</button>
                    <button class="secondary" id="cancelTimerBtn" onclick="stopTimer()">Cancel Timer</button>
                </div>
                <button id="clearTimeBtn" class="secondary" onclick="resetSamplingTime()" style="display: none;">Clear All</button>
            </div>
        </div>

    </div>
    <div class="footer-version">v41</div>
</div>

<audio id="alarmSound" loop preload="auto">
    <source src="alarm.ogg" type="audio/ogg">
</audio>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch((err) => console.error("SW Failed:", err));
        });
    }

    const allCardIds = ['card-pickup', 'card-averaging', 'card-salinity', 'card-temp', 'card-stopwatch', 'card-sampling'];
    
    function toggleCard(cardId) {
        const card = document.getElementById(cardId);
        card.classList.toggle('collapsed');
        localStorage.setItem(cardId + '_collapsed', card.classList.contains('collapsed') ? '1' : '0');
    }
    
    function togglePin(event, cardId) {
        event.stopPropagation();

        allCardIds.forEach(id => {

                pinnedContainer.appendChild(card);
                pinnedCount++;

            }

        if (pinnedCount > 0) {

        draggedEl.style.transform = `translate(${adjustedDeltaX}px, -2px) scale(1.05)`; 
        updatePickupTabOffsets(adjustedDeltaX);

        // Auto-scroll boundary detection
        const rect = container.getBoundingClientRect();
        if (pickupClientX < rect.left + 40) pickupScrollVelocity = -6;
        else if (pickupClientX > rect.right - 40) pickupScrollVelocity = 6;
        else pickupScrollVelocity = 0;
        
        if (pickupScrollVelocity !== 0 && !pickupAutoScrollReq) {
            pickupAutoScrollReq = requestAnimationFrame(function scrollLoop() {
                if (pickupScrollVelocity === 0 || !isPickupTabDragging) {
                    pickupAutoScrollReq = null;

                }
                container.scrollLeft += pickupScrollVelocity;
                const newScrollLeft = container.scrollLeft;
                const newDeltaX = pickupClientX - pickupTabStartX + (newScrollLeft - pickupTabStartScrollLeft);
                
                if (pickupTabElements[draggingPickupTabIdx]) {

        }

    function calculatePickup() {

        if(isNaN(pre) || isNaN(post) || pre === 0) {
            res.style.display = "none";
            clearBtn.style.display = (preStr !== '' || postStr !== '') ? "block" : "none";
            return;
        }
        
        const dec = (pre - post) / pre;
        res.style.display = "block";
        res.innerHTML = `Decimal: <strong>${dec.toFixed(4)}</strong> | <span class="pickup-pct">${(dec * 100).toFixed(2)}%</span>`;

        const tab = appTabs.find(t => t.id === activeTabId);
        if (appTabs.length === 1) {
            alert("You must have at least one sample.");
            return;
        }
        if (confirm(`Are you sure you want to delete "${tab.name}"?`)) {
            let currentIndex = appTabs.findIndex(t => t.id === activeTabId);
            appTabs = appTabs.filter(t => t.id !== activeTabId);
            
            let newIndex = currentIndex - 1;
            if (newIndex < 0) newIndex = 0;
            
            activeTabId = appTabs[newIndex].id; 
            isTabMenuOpen = false;
            saveTabs();
            renderTabs();
            renderList();
            updateTabMenuState();
        }
    }

    function addNewTab() {
        let maxNum = 0;
        appTabs.forEach(t => {
            const match = t.name.match(/^Sample (\d+)$/i);
            if (match) {
                const num = parseInt(match[1]);
                if (num > maxNum) maxNum = num;
            }
        });
        const nextNum = maxNum > 0 ? maxNum + 1 : appTabs.length + 1;
        
        const newTab = { id: 'tab_' + Date.now(), name: `Sample ${nextNum}`, data: [] };
        appTabs.push(newTab);
        activeTabId = newTab.id;
        isTabMenuOpen = false;
        
        const display = document.getElementById('lastAddedDisplay');
        display.innerHTML = ''; 
        saveTabs();
        renderTabs();
        renderList();
        updateTabMenuState();
    }

    // ==========================================
    // ---- LIST DRAG & GENERAL LOGIC ----
    // ==========================================

    let lastGeneratedTimeStr = "";
    let targetTimeObject = null;
    let timerInterval = null;
    let vibrationInterval = null;
    const alarm = document.getElementById('alarmSound');

    function convertTemp(source) {
        const cInput = document.getElementById('celsiusVal');
        const fInput = document.getElementById('fahrenheitVal');
        const clearBtn = document.getElementById('clearTempBtn');
        
        if (source === 'C') {
            if (cInput.value === '') { fInput.value = ''; clearBtn.style.display = 'none'; return; }
            const c = parseFloat(cInput.value);
            fInput.value = ((c * 9/5) + 32).toFixed(2).replace(/\.00$/, '');
        } else {
            if (fInput.value === '') { cInput.value = ''; clearBtn.style.display = 'none'; return; }
            const f = parseFloat(fInput.value);
            cInput.value = ((f - 32) * 5/9).toFixed(2).replace(/\.00$/, '');
        }
        clearBtn.style.display = 'block';
    }

    function resetTemp() {
        document.getElementById('celsiusVal').value = '';
        document.getElementById('fahrenheitVal').value = '';
        document.getElementById('clearTempBtn').style.display = 'none';
    }

    let swInterval = null;
    let swStartTime = 0;
    let swElapsed = 0;
    let isSwRunning = false;
    let swMode = null; 
    const swDisplay = document.getElementById('stopwatchDisplay');
    const holdBtn = document.getElementById('holdTimerBtn');

    function updateStopwatch() {
        let diff = swElapsed;
        if (isSwRunning) { diff += (Date.now() - swStartTime); }
        const m = Math.floor(diff / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        const ms = Math.floor((diff % 1000) / 10);
        swDisplay.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
    }

    function toggleStopwatch() {
        if (isSwRunning && swMode === 'hold') return; 

        const toggleBtn = document.getElementById('toggleTimerBtn');
        if (isSwRunning) {
            clearInterval(swInterval);
            swElapsed += (Date.now() - swStartTime);
            isSwRunning = false;
            swMode = null;
            updateStopwatch();
            toggleBtn.innerText = "Start";
            toggleBtn.style.backgroundColor = ""; 
        } else {
            swStartTime = Date.now();
            swInterval = setInterval(updateStopwatch, 10);
            isSwRunning = true;
            swMode = 'tap';
            toggleBtn.innerText = "Stop";
            toggleBtn.style.backgroundColor = "var(--accent)"; 
        }
    }

    holdBtn.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });

    holdBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); 
        if(e.button !== 0 && e.pointerType === 'mouse') return; 
        try { holdBtn.setPointerCapture(e.pointerId); } catch(err){}
        
        if (isSwRunning) return; 
        isSwRunning = true;
        swMode = 'hold';
        swStartTime = Date.now();
        swInterval = setInterval(updateStopwatch, 10);
        
        holdBtn.style.filter = 'brightness(0.8)';
        holdBtn.style.transform = 'scale(0.98)';
    });

    const stopAction = (e) => {
        if (!isSwRunning || swMode !== 'hold') return; 
        clearInterval(swInterval);
        
        swElapsed += (Date.now() - swStartTime);
        isSwRunning = false; 
        swMode = null;
        updateStopwatch(); 
        
        holdBtn.style.filter = '';
        holdBtn.style.transform = 'scale(1)';
        try { holdBtn.releasePointerCapture(e.pointerId); } catch(err){}
    };

    holdBtn.addEventListener('pointerup', stopAction);
    holdBtn.addEventListener('pointercancel', stopAction);

    function resetStopwatch() {
        if (swElapsed === 0 && !isSwRunning) return;
        if (confirm("Reset the stopwatch?")) {
            if (isSwRunning) {
                isSwRunning = false;
                swMode = null;
                clearInterval(swInterval);
                holdBtn.style.filter = '';
                holdBtn.style.transform = 'scale(1)';
                
                const toggleBtn = document.getElementById('toggleTimerBtn');
                toggleBtn.innerText = "Start";
                toggleBtn.style.backgroundColor = "";
            }
            swElapsed = 0;
            swDisplay.innerText = "00:00.00";
        }
    }

    function generateTime(isRecursive) {
        const minInput = document.getElementById('minMinutes');
        const maxInput = document.getElementById('maxMinutes');
        const startTimeInput = document.getElementById('startTime');
        const res = document.getElementById('timeResult');

        [minInput, maxInput, startTimeInput].forEach(el => el.classList.remove('input-error'));

        if (!isRecursive) {
            let errors = [];
            if (!minInput.value) { errors.push("Min Minutes"); minInput.classList.add('input-error'); }
            if (!maxInput.value) { errors.push("Max Minutes"); maxInput.classList.add('input-error'); }
            if (!startTimeInput.value) { errors.push("Start Time"); startTimeInput.classList.add('input-error'); }

            if (errors.length > 0) {
                res.style.display = "block";
                res.innerHTML = `<span style="color:var(--error); font-weight:bold;">Missing: ${errors.join(', ')}</span>`;
                
                setTimeout(() => {
                    if (res.innerHTML.includes("Missing:")) {
                        res.style.display = "none";
                        res.innerHTML = "";
                        [minInput, maxInput, startTimeInput].forEach(el => el.classList.remove('input-error'));
                    }
                }, 3500);
                return;
            }
        }

        const min = parseInt(minInput.value); 
        const max = parseInt(maxInput.value);
        let startStr = isRecursive ? lastGeneratedTimeStr : startTimeInput.value;
        
        const rand = Math.floor(Math.random() * (max - min + 1)) + min;
        const [h, m] = startStr.split(':').map(Number);
        
        let target = new Date();
        target.setHours(h, m + rand, 0, 0);
        if (target < new Date()) { target.setDate(target.getDate() + 1); }

        targetTimeObject = target;
        lastGeneratedTimeStr = `${String(target.getHours()).padStart(2,'0')}:${String(target.getMinutes()).padStart(2,'0')}`;
        
        res.style.display = "block";
        res.innerHTML = `
            <div style="font-size:0.85rem;color:#64748b;">Reference: ${startStr} (+${rand}m)</div>
            <div style="font-weight:bold;color:var(--primary);font-size:1.4rem;">Target: ${lastGeneratedTimeStr}</div>
            <button class="btn-recursive" onclick="generateTime(true)">Next window from ${lastGeneratedTimeStr}</button>
        `;
        
        document.getElementById('timerControls').style.display = 'block';
        document.getElementById('clearTimeBtn').style.display = 'block';
    }

    function handleStartTimer() {
        if (Notification.permission === "default") Notification.requestPermission();
        if (timerInterval && !confirm("An active timer is already running. Override it?")) return;
        if (targetTimeObject) startTimer(targetTimeObject);
    }

    function startTimer(targetDate) {
        stopTimer();
        const display = document.getElementById('countdown');
        const cancelBtn = document.getElementById('cancelTimerBtn');
        const stopBtn = document.getElementById('stopAlarmBtn');
        
        document.getElementById('activeTimer').style.display = 'block';
        display.classList.add('timer-active');
        cancelBtn.style.display = 'block';
        stopBtn.style.display = 'none';

        timerInterval = setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate.getTime() - now;

            if (distance < 0) {
                triggerFinalAlarm();
                return;
            }

            const h = Math.floor((distance % 86400000) / 3600000);
            const m = Math.floor((distance % 3600000) / 60000);
            const s = Math.floor((distance % 60000) / 1000);
            display.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }, 1000);
    }

    async function triggerFinalAlarm() {
        clearInterval(timerInterval);
        timerInterval = null;
        
        const display = document.getElementById('countdown');
        display.innerText = "TIME UP!";
        display.style.color = "var(--error)";
        document.getElementById('cancelTimerBtn').style.display = 'none';
        document.getElementById('stopAlarmBtn').style.display = 'block';

        alarm.play().catch(e => console.log("Audio block."));
        
        if ("vibrate" in navigator) {
            navigator.vibrate([500, 200, 500, 200, 500]);
            vibrationInterval = setInterval(() => {
                try { navigator.vibrate([500, 200, 500, 200, 500]); } catch(e){}
            }, 2000);
        }

        if (Notification.permission === "granted") {
            try {
                const reg = await navigator.serviceWorker.ready;
                await reg.showNotification("QC ALERT: COLLECT SAMPLES!", { 
                    body: "Tap to stop the alarm.", 
                    requireInteraction: true,
                    vibrate: [500, 200, 500, 200, 500],
                    icon: "https://cdn-icons-png.flaticon.com/512/1162/1162456.png",
                    tag: 'qc-alert' 
                });
            } catch (err) {
                console.log("Notification failed", err);
            }
        }
    }

    async function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        
        if (vibrationInterval) {
            clearInterval(vibrationInterval);
            vibrationInterval = null;
        }
        if ("vibrate" in navigator) { try { navigator.vibrate(0); } catch(e){} }

        alarm.pause();
        alarm.currentTime = 0;
        document.getElementById('activeTimer').style.display = 'none';
        document.getElementById('countdown').style.color = "#38bdf8";
        document.getElementById('countdown').classList.remove('timer-active');
        
        try {
            const reg = await navigator.serviceWorker.ready;
            const notifications = await reg.getNotifications({ tag: 'qc-alert' });
            notifications.forEach(n => n.close());
        } catch(e) {}
    }

    function resetSamplingTime() {
        const confirmMsg = timerInterval ? "Cancel current timer and clear data?" : "Are you sure you want to clear all sampling time data?";
        if (!confirm(confirmMsg)) return;
        
        stopTimer();
        document.getElementById('minMinutes').value = '';
        document.getElementById('maxMinutes').value = '';
        document.getElementById('startTime').value = '';
        document.getElementById('timeResult').style.display = 'none';
        document.getElementById('timerControls').style.display = 'none';
        document.getElementById('clearTimeBtn').style.display = 'none';
        lastGeneratedTimeStr = "";
        targetTimeObject = null;
    }

    // Number List Logic
    let listDraggingIdx = null;
    let listStartY = 0;
    let listRowHeight = 0;
    let listElements = [];

    function addNumber() {
        const inp = document.getElementById('numberInput');
        const val = parseFloat(inp.value); if(isNaN(val)) return;
        
        const display = document.getElementById('lastAddedDisplay');
        display.innerHTML = `Last added: ${val}`;
        display.style.color = 'var(--success)';
        
        getActiveData().push(val); 
        saveTabs();
        inp.value=''; 
        renderList();
        
        inp.focus(); 
    }

    function updateNumber(index, inputEl) {
        const arr = getActiveData();
        const newVal = parseFloat(inputEl.value);
        if (isNaN(newVal)) { inputEl.value = arr[index]; return; }
        
        const oldVal = arr[index];
        if (newVal !== oldVal) {
            arr[index] = newVal;
            saveTabs();
            const display = document.getElementById('lastAddedDisplay');
            display.innerHTML = `Edited: ${oldVal} <span style="margin: 0 5px;">&#10142;</span> ${newVal}`;
            display.style.color = 'var(--accent)'; 
            updateStats();
        }
    }

    function removeNumber(index) {
        getActiveData().splice(index, 1);
        saveTabs();
        const arr = getActiveData();
        if (arr.length === 0) document.getElementById('lastAddedDisplay').innerHTML = '';
        renderList();
    }

    function onListPointerMove(e) {
        if (listDraggingIdx === null) return;
        const deltaY = e.clientY - listStartY;
        const draggedEl = listElements[listDraggingIdx];
        draggedEl.style.transform = `translateY(${deltaY}px)`;

        let moveSteps = Math.round(deltaY / listRowHeight);
        let targetIdx = listDraggingIdx + moveSteps;
        targetIdx = Math.max(0, Math.min(listElements.length - 1, targetIdx));

        listElements.forEach((el, idx) => {
            if (idx === listDraggingIdx) return;
            let offset = 0;
            if (idx > listDraggingIdx && idx <= targetIdx) offset = -listRowHeight;
            else if (idx < listDraggingIdx && idx >= targetIdx) offset = listRowHeight;
            
            if (el.dataset.offset != offset) {
                el.style.transform = `translateY(${offset}px)`;
                el.dataset.offset = offset;
            }
        });
    }

    function onListPointerUp(e) {
        if (listDraggingIdx === null) return;
        const deltaY = e.clientY - listStartY;
        let moveSteps = Math.round(deltaY / listRowHeight);
        let targetIdx = listDraggingIdx + moveSteps;
        targetIdx = Math.max(0, Math.min(listElements.length - 1, targetIdx));

        if (listDraggingIdx !== targetIdx) {
            const arr = getActiveData();
            const item = arr.splice(listDraggingIdx, 1)[0];
            arr.splice(targetIdx, 0, item);
            saveTabs();
        }

        listDraggingIdx = null;
        document.removeEventListener('pointermove', onListPointerMove);
        document.removeEventListener('pointerup', onListPointerUp);
        document.removeEventListener('pointercancel', onListPointerUp);
        renderList();
    }

    function renderList() {
        const container = document.getElementById('numberList');
        const clearBtn = document.getElementById('clearAllBtn');
        const arr = getActiveData();
        const activeTab = appTabs.find(t => t.id === activeTabId);
        
        container.innerHTML = '';
        container.style.display = arr.length ? "flex" : "none";
        clearBtn.style.display = arr.length ? "block" : "none";
        
        if (activeTab) {
            clearBtn.innerText = `Clear ${activeTab.name}`;
        }
        
        arr.forEach((n, i) => {
            const div = document.createElement('div');
            div.className = 'number-item';
            div.innerHTML = `
                <div class="drag-handle" title="Drag to reorder">&#x2261;</div>
                <input type="number" class="edit-input" value="${n}" onchange="updateNumber(${i}, this); this.blur();" inputmode="decimal">
                <button class="remove-btn" onclick="removeNumber(${i})" title="Remove">&times;</button>
            `;

            const handle = div.querySelector('.drag-handle');
            const inputField = div.querySelector('.edit-input');

            handle.addEventListener('pointerdown', (e) => {
                document.activeElement.blur(); 
                listDraggingIdx = i;
                listStartY = e.clientY;
                listElements = Array.from(container.children);
                
                const gap = parseInt(window.getComputedStyle(container).gap) || 8;
                listRowHeight = listElements[0].offsetHeight + gap;
                
                listElements.forEach((el) => {
                    el.style.transition = 'transform 0.2s cubic-bezier(0.2, 0, 0, 1)';
                    el.dataset.offset = 0;
                });
                
                div.style.transition = 'none'; 
                div.classList.add('dragging');
                inputField.style.pointerEvents = 'none'; 
                
                document.addEventListener('pointermove', onListPointerMove);
                document.addEventListener('pointerup', onListPointerUp);
                document.addEventListener('pointercancel', onListPointerUp);
            });

            container.appendChild(div);
        });
        updateStats();
    }

    function clearNumbers() { 
        const tab = appTabs.find(t => t.id === activeTabId);
        if (confirm(`Are you sure you want to clear all data in "${tab.name}"?`)) { 
            tab.data = [];
            saveTabs();
            const display = document.getElementById('lastAddedDisplay');
            display.innerHTML = ''; 
            display.style.color = 'var(--success)';
            renderList(); 
        } 
    }

    function updateStats() {
        const arr = getActiveData();
        const sum = arr.reduce((a, b) => a + b, 0);
        document.getElementById('statCount').innerText = arr.length;
        document.getElementById('statSum').innerText = sum.toFixed(2).replace(/\.00$/, '');
        document.getElementById('statAvg').innerText = (arr.length ? (sum / arr.length) : 0).toFixed(2).replace(/\.00$/, '');
    }

    function calculateSalinity() {
        const brix = parseFloat(document.getElementById('brixVal').value); if (isNaN(brix)) return;
        const res = document.getElementById('salinityResult'); res.style.display = "block";
        res.innerHTML = `Salinity: <strong>${((brix / 26.4) * 100).toFixed(2)}%</strong>`;
        document.getElementById('clearSalinityBtn').style.display = 'block';
    }

    function resetSalinity() {
        document.getElementById('brixVal').value = ''; document.getElementById('salinityResult').style.display = 'none';
        document.getElementById('clearSalinityBtn').style.display = 'none';
    }
</script>
</body>
</html>
