<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QC Toolset Pro</title>
    
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1162/1162456.png">
    
    <link rel="manifest" href='data:application/manifest+json,%7B%22name%22%3A%22QC%20Toolset%20Pro%22%2C%22short_name%22%3A%22QC%20Tool%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f3f4f6%22%2C%22theme_color%22%3A%22%232563eb%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F1162%2F1162456.png%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D'>

    <style>
        :root { 
            --primary: #2563eb; 
            --primary-hover: #1d4ed8; 
            --bg: #f3f4f6; 
            --card-bg: #ffffff; 
            --text: #1f2937; 
            --border: #e5e7eb; 
            --accent: #d97706; 
            --success: #10b981;
            --error: #ef4444;
        }
        
        body { overscroll-behavior-y: contain; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .container { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 20px; padding-bottom: 30px; }
        .section-container { width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .divider { text-align: center; color: #94a3b8; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin: -5px 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .divider::before, .divider::after { content: ""; height: 1px; background-color: var(--border); flex: 1; }
        
        .card { background-color: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); position: relative; }
        
        .card h2 { 
            margin-top: 0; 
            border-bottom: 2px solid var(--border); 
            padding-bottom: 10px; 
            margin-bottom: 20px; 
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 12px; 
        }
        
        .card-title-text { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        .chevron { font-size: 0.8rem; color: #94a3b8; transition: transform 0.3s ease; justify-self: end;}
        
        .pin-btn {
            grid-column: 1;
            background: transparent !important;
            border: none !important;
            color: #cbd5e1;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            margin: 0;
            margin-left: -6px; 
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
            -webkit-appearance: none;
        }

        @media (hover: hover) {
            .pin-btn:hover { background: #f1f5f9 !important; color: #94a3b8; }
        }
        
        .pin-btn svg { pointer-events: none; transition: fill 0.2s; }
        .card.pinned .pin-btn { color: var(--accent); }
        .card.pinned .pin-btn svg { fill: var(--accent); }
        
        .card.collapsed h2 { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .card.collapsed .card-body { display: none; }
        .card.collapsed .chevron { transform: rotate(-90deg); }

        .footer-version { text-align: center; color: #94a3b8; font-size: 0.75rem; margin-top: 20px; }

        /* --- Folder Tabs --- */
        .tabs-container { 
            display: flex; 
            border-bottom: 2px solid var(--border); 
            margin-bottom: 15px; 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none; 
            scroll-behavior: smooth;
            align-items: flex-end; 
            padding-top: 15px; 
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tabs-list { 
            display: flex; 
            gap: 4px; 
            align-items: flex-end; 
            margin: 0; 
            padding: 0;
            margin-bottom: -2px; 
            position: relative;
        }
        .tab-btn { 
            margin: 0; 
            background: #f8fafc; 
            border: 1px solid var(--border); 
            border-bottom: none; 
            padding: 8px 16px; 
            border-radius: 8px 8px 0 0; 
            cursor: pointer; 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: #64748b; 
            white-space: nowrap; 
            -webkit-tap-highlight-color: transparent;
            height: 38px; 
            box-sizing: border-box;
            line-height: 1.2;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: pan-x pan-y; 
        }
        .tab-btn.active { 
            background: #ffffff; 
            color: var(--primary); 
            border-top: 3px solid var(--primary); 
            border-bottom: none; 
            height: 38px; 
            padding-top: 8px; 
            z-index: 2; 
        }
        .add-tab-btn { 
            margin: 0; 
            background: transparent; 
            color: #94a3b8; 
            border: none; 
            font-size: 1.5rem; 
            cursor: pointer; 
            padding: 0 15px; 
            font-weight: bold; 
            transition: color 0.2s; 
            -webkit-tap-highlight-color: transparent; 
            height: 38px; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 4px; 
            user-select: none;
            -webkit-user-select: none;
        }
        .add-tab-btn:hover { color: var(--primary); }

        /* --- Inline Tab Options Menu --- */
        .tab-options-panel {
            display: none; 
            flex-direction: column; 
            background: #f8fafc; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            margin-bottom: 15px;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .row { display: flex; gap: 15px; } .row .input-group { flex: 1; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 0.875rem; }
        
        input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; font-family: inherit; width: 100%; max-width: 100%; min-height: 46px; box-sizing: border-box; transition: border-color 0.3s ease; margin: 0; display: block; -webkit-appearance: none; appearance: none; }
        input.input-error { border: 2px solid var(--error); background-color: #fff1f2; }
        
        /* Specific override so checkboxes aren't giant blocks */
        input[type="checkbox"].tick-box {
            width: 24px !important;
            height: 24px !important;
            min-height: 24px !important;
            padding: 0 !important;
            margin: 0 12px 0 0 !important;
            -webkit-appearance: auto !important;
            appearance: auto !important;
            display: inline-block !important;
            cursor: pointer;
        }

        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; -webkit-tap-highlight-color: transparent; margin-bottom: 8px; }
        button:hover { background-color: var(--primary-hover); }
        button.secondary { background-color: var(--error); width: 100%; margin-top: 10px; }
        
        .btn-timer-start { background-color: #8b5cf6; }
        .btn-timer-start:hover { background-color: #7c3aed; }
        .timer-display { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 2rem; font-weight: bold; margin-top: 10px; text-align: center; border: 2px solid #334155; transition: all 0.3s; }
        .timer-active { border-color: var(--success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .timer-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        .result { margin-top: 15px; padding: 15px; background-color: #f8fafc; border-radius: 8px; border: 1px solid var(--border); font-size: 1.1rem; text-align: center; }
        .pickup-pct { color: var(--accent); font-weight: 800; font-size: 1.3rem; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 15px 0; text-align: center; }
        .stat-box { background-color: #f8fafc; border: 1px solid var(--border); padding: 10px; border-radius: 8px; }
        .stat-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; font-weight: bold; }
        .stat-value { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        
        .drag-container { display: none; flex-direction: column; gap: 8px; margin: 15px 0; max-height: 350px; overflow-y: auto; overflow-x: hidden; border-radius: 8px; padding: 4px; }
        .number-item { display: flex; align-items: center; background: #fff; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; gap: 10px; position: relative; z-index: 1; -webkit-tap-highlight-color: transparent; }
        .number-item.dragging { z-index: 100; opacity: 0.9; }
        .drag-handle { color: #94a3b8; font-size: 1.5rem; cursor: grab; padding: 10px; margin-left: -5px; display: flex; align-items: center; user-select: none; -webkit-user-select: none; touch-action: none; transition: color 0.2s; -webkit-tap-highlight-color: transparent; }
        .drag-handle:active { cursor: grabbing; color: var(--primary); }
        .edit-input { flex: 1; border: 1px solid transparent; background: transparent; font-weight: 600; font-size: 1.1rem; padding: 4px; transition: border-color 0.2s; }
        .edit-input:focus { border-bottom: 2px solid var(--primary); outline: none; border-radius: 0; }
        .remove-btn { background: #fee2e2; color: #ef4444; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; padding: 0; line-height: 1; transition: background-color 0.2s; }
        .remove-btn:hover { background: #fecaca; }
        .last-added-text { font-size: 0.85rem; color: var(--success); font-weight: 600; margin-top: 5px; min-height: 1.2em; transition: color 0.3s; display: flex; justify-content: flex-start; align-items: center; }
        .btn-recursive { background-color: var(--success); margin-top: 8px; font-size: 0.95rem; }
        
        @media (max-width: 480px) { .row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div id="pinned-section" class="section-container" style="display: none;"></div>
    <div id="pinned-divider" class="divider" style="display: none;">Tools</div>
    <div id="unpinned-section" class="section-container">
    
        <div class="card" id="card-pickup">
            <h2 onclick="toggleCard('card-pickup')">
                <button class="pin-btn" onclick="togglePin(event, 'card-pickup')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Pickup Calculator</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">

                <div class="tabs-container" id="pickupTabsContainer">
                    <div id="pickupTabsList" class="tabs-list"></div>
                </div>

                <div id="pickupTabOptionsPanel" class="tab-options-panel">
                    <label style="margin-bottom: 5px; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Manage Sample</label>
                    <div style="display:flex; gap:10px; width:100%; margin-bottom: 10px;">
                        <input type="text" id="renamePickupTabInput" placeholder="Sample Name" style="flex:1; min-height:40px; padding: 8px 12px; margin:0;">
                        <button onclick="savePickupTabName()" style="width:auto; min-height:40px; margin:0; padding:0 20px;">Save</button>
                    </div>
                    <button onclick="confirmDeletePickupTab()" class="secondary" style="margin:0; min-height:40px;">Delete Sample</button>
                </div>

                <form onsubmit="event.preventDefault();">
                    <div class="row">
                        <div class="input-group">
                            <label>Pre-sample</label>
                            <input type="number" step="any" id="preSampleVal" inputmode="decimal" oninput="savePickupInputs()">
                        </div>
                        <div class="input-group">
                            <label>Post-sample</label>
                            <input type="number" step="any" id="postSampleVal" inputmode="decimal" oninput="savePickupInputs()">
                        </div>
                    </div>
                </form>
                
                <div class="result" id="pickupResult" style="display: none; margin-top: 0;"></div>
                <button id="clearPickupBtn" class="secondary" onclick="resetPickup()" style="display: none; margin-top: 15px;">Clear Current Sample</button>
            </div>
        </div>

        <div class="card" id="card-averaging">
            <h2 onclick="toggleCard('card-averaging')">
                <button class="pin-btn" onclick="togglePin(event, 'card-averaging')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Sum & Averaging</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                
                <div class="tabs-container" id="tabsContainer">
                    <div id="tabsList" class="tabs-list"></div>
                </div>

                <div id="tabOptionsPanel" class="tab-options-panel">
                    <label style="margin-bottom: 5px; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Manage Sample</label>
                    <div style="display:flex; gap:10px; width:100%; margin-bottom: 10px;">
                        <input type="text" id="renameTabInput" placeholder="Sample Name" style="flex:1; min-height:40px; padding: 8px 12px; margin:0;">
                        <button onclick="saveTabName()" style="width:auto; min-height:40px; margin:0; padding:0 20px;">Save</button>
                    </div>
                    <button onclick="confirmDeleteTab()" class="secondary" style="margin:0; min-height:40px;">Delete Sample</button>
                </div>

                <div class="stats-grid">
                    <div class="stat-box"><div class="stat-label">Count</div><div class="stat-value" id="statCount">0</div></div>
                    <div class="stat-box"><div class="stat-label">Sum</div><div class="stat-value" id="statSum">0</div></div>
                    <div class="stat-box"><div class="stat-label">Avg</div><div class="stat-value" id="statAvg">0</div></div>
                </div>
                <div class="input-group">
                    <label>Add Number</label>
                    <form onsubmit="event.preventDefault(); addNumber();" style="display: flex; gap: 10px; width: 100%; margin: 0;">
                        <input type="number" step="any" id="numberInput" inputmode="decimal" placeholder="0.00" style="flex: 1;">
                        <button type="submit" style="width: auto; margin-bottom: 0;">Add</button>
                    </form>
                    <div class="last-added-text" id="lastAddedDisplay"></div>
                </div>
                <div id="numberList" class="drag-container"></div>
                <button id="clearAllBtn" class="secondary" onclick="clearNumbers()" style="display:none;">Clear Current Sample</button>
            </div>
        </div>

        <div class="card" id="card-salinity">
            <h2 onclick="toggleCard('card-salinity')">
                <button class="pin-btn" onclick="togglePin(event, 'card-salinity')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Salinity Calculator</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                <form onsubmit="event.preventDefault(); calculateSalinity();">
                    <div class="input-group">
                        <label>Brix Value</label>
                        <input type="number" step="any" id="brixVal" inputmode="decimal" placeholder="Enter Brix">
                    </div>
                    <button type="submit">Calculate Salinity</button>
                </form>
                <button id="clearSalinityBtn" class="secondary" onclick="resetSalinity()" style="display: none;">Clear</button>
                <div class="result" id="salinityResult" style="display: none;"></div>
            </div>
        </div>

        <div class="card" id="card-temp">
            <h2 onclick="toggleCard('card-temp')">
                <button class="pin-btn" onclick="togglePin(event, 'card-temp')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Temperature Converter</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                <form onsubmit="event.preventDefault();">
                    <div class="row">
                        <div class="input-group">
                            <label>Celsius (°C)</label>
                            <input type="number" step="any" id="celsiusVal" inputmode="decimal" placeholder="°C" oninput="convertTemp('C')">
                        </div>
                        <div class="input-group">
                            <label>Fahrenheit (°F)</label>
                            <input type="number" step="any" id="fahrenheitVal" inputmode="decimal" placeholder="°F" oninput="convertTemp('F')">
                        </div>
                    </div>
                </form>
                <button id="clearTempBtn" class="secondary" onclick="resetTemp()" style="display: none;">Clear</button>
            </div>
        </div>

        <div class="card" id="card-stopwatch">
            <h2 onclick="toggleCard('card-stopwatch')">
                <button class="pin-btn" onclick="togglePin(event, 'card-stopwatch')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Stopwatch</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                <div class="timer-display" id="stopwatchDisplay" style="margin-top: 0; margin-bottom: 15px;">00:00.00</div>
                <button id="holdTimerBtn" class="btn-timer-start" oncontextmenu="return false;" style="-webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; margin-bottom: 10px;">Hold to Time</button>
                <div style="display: flex; gap: 10px;">
                    <button id="toggleTimerBtn" onclick="toggleStopwatch()" style="margin: 0; flex: 1;">Start</button>
                    <button class="secondary" onclick="resetStopwatch()" style="margin: 0; flex: 1;">Reset</button>
                </div>
            </div>
        </div>

        <div class="card" id="card-sampling">
            <h2 onclick="toggleCard('card-sampling')">
                <button class="pin-btn" onclick="togglePin(event, 'card-sampling')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Sampling Time</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                <form onsubmit="event.preventDefault(); generateTime(false);">
                    <div class="row">
                        <div class="input-group">
                            <label>Min Mins</label>
                            <input type="number" id="minMinutes" placeholder="e.g. 40" inputmode="numeric">
                        </div>
                        <div class="input-group">
                            <label>Max Mins</label>
                            <input type="number" id="maxMinutes" placeholder="e.g. 60" inputmode="numeric">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Start Time</label>
                        <input type="time" id="startTime">
                    </div>
                    <button type="submit">Generate Time</button>
                </form>
                <div id="timeResult" class="result" style="display: none;"></div>
                <div id="timerControls" style="display: none; margin-top: 15px;">
                    <button class="btn-timer-start" onclick="handleStartTimer()">Start Countdown</button>
                </div>
                <div id="activeTimer" style="display: none; margin-top: 15px;">
                    <div class="timer-label">Time Remaining</div>
                    <div class="timer-display" id="countdown">00:00:00</div>
                    <button class="secondary" id="stopAlarmBtn" onclick="stopTimer()" style="display: none;">Stop Alarm</button>
                    <button class="secondary" id="cancelTimerBtn" onclick="stopTimer()">Cancel Timer</button>
                </div>
                <button id="clearTimeBtn" class="secondary" onclick="resetSamplingTime()" style="display: none;">Clear All</button>
            </div>
        </div>
        
        <div class="card" id="card-estimator">
            <h2 onclick="toggleCard('card-estimator')">
                <button class="pin-btn" onclick="togglePin(event, 'card-estimator')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Production Estimator</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">

                <div class="tabs-container" id="estimatorTabsContainer">
                    <div id="estimatorTabsList" class="tabs-list"></div>
                </div>

                <div id="estimatorTabOptionsPanel" class="tab-options-panel">
                    <label style="margin-bottom: 5px; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Manage Line</label>
                    <div style="display:flex; gap:10px; width:100%; margin-bottom: 10px;">
                        <input type="text" id="renameEstimatorTabInput" placeholder="Line Name" style="flex:1; min-height:40px; padding: 8px 12px; margin:0;">
                        <button onclick="saveEstimatorTabName()" style="width:auto; min-height:40px; margin:0; padding:0 20px;">Save</button>
                    </div>
                    <button onclick="confirmDeleteEstimatorTab()" class="secondary" style="margin:0; min-height:40px;">Delete Line</button>
                </div>

                <div class="input-group">
                    <label>What are we counting?</label>
                    <input type="text" id="estimatorUnitInput" placeholder="e.g. Pallets, Trays, Packs" oninput="updateEstimatorUnit()">
                </div>

                <form onsubmit="event.preventDefault(); addEstimatorEntry();">
                    <div class="row">
                        <div class="input-group">
                            <label>Amount (<span id="lblEstimatorUnit">Units</span>)</label>
                            <input type="number" id="estAmountInput" step="any" placeholder="Total Count" required>
                        </div>
                        <div class="input-group">
                            <label>Clock Time</label>
                            <input type="time" id="estTimeInput" required>
                        </div>
                    </div>
                    <button type="submit">Add Log</button>
                </form>

                <div id="estimatorList" class="drag-container" style="gap:4px; max-height:280px; padding-top: 10px;"></div>

                <div class="result" id="estimatorPaceResult" style="display: none; margin-top: 15px;"></div>

                <div id="estimatorForecastBox" style="display:none; margin-top:15px; border-top:2px solid var(--border); padding-top:15px;">
                    <label style="font-weight:bold; color:var(--primary); margin-bottom:10px; display:block;">Forecast Finish Time</label>
                    <div class="input-group">
                        <input type="number" id="estRemainingInput" placeholder="Remaining Amount" step="any" oninput="calculateEstimatorPace()">
                    </div>
                    <div class="result" id="estimatorForecastResult" style="display: none; margin-top: 5px; background-color:#eff6ff; border-color:#bfdbfe;"></div>
                </div>
            </div>
        </div>    
    </div>
    <div class="footer-version">v46</div>
</div>

<audio id="alarmSound" loop preload="auto">
    <source src="alarm.ogg" type="audio/ogg">
</audio>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch((err) => console.error("SW Failed:", err));
        });
    }

    const allCardIds = ['card-pickup', 'card-averaging', 'card-salinity', 'card-temp', 'card-stopwatch', 'card-sampling', 'card-estimator'];
    let preventTabClick = false; 
    
    function toggleCard(cardId) {
        const card = document.getElementById(cardId);
        card.classList.toggle('collapsed');
        localStorage.setItem(cardId + '_collapsed', card.classList.contains('collapsed') ? '1' : '0');
    }
    
    function togglePin(event, cardId) {
        event.stopPropagation(); 
        const card = document.getElementById(cardId);
        if (card.classList.contains('pinned')) {
            card.classList.remove('pinned');
            localStorage.setItem(cardId + '_pinned', '0');
        } else {
            card.classList.add('pinned');
            localStorage.setItem(cardId + '_pinned', '1');
        }
        reorderCards();
    }
    
    function reorderCards() {
        const pinnedContainer = document.getElementById('pinned-section');
        const unpinnedContainer = document.getElementById('unpinned-section');
        const divider = document.getElementById('pinned-divider');
        let pinnedCount = 0;
        allCardIds.forEach(id => {
            const card = document.getElementById(id);
            if (card.classList.contains('pinned')) {
                pinnedContainer.appendChild(card);
                pinnedCount++;
            } else {
                unpinnedContainer.appendChild(card);
            }
        });
        if (pinnedCount > 0) {
            pinnedContainer.style.display = 'flex';
            divider.style.display = 'flex';
        } else {
            pinnedContainer.style.display = 'none';
            divider.style.display = 'none';
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        allCardIds.forEach(id => {
            const card = document.getElementById(id);
            if (localStorage.getItem(id + '_pinned') === '1') card.classList.add('pinned');
            const savedState = localStorage.getItem(id + '_collapsed');
            if (savedState === '1' || savedState === null) card.classList.add('collapsed');
        });
        
        reorderCards();
        
        // Initialize Tab Systems
        renderEstimatorTabs();
        loadEstimatorInputs();
        
        renderTabs();
        renderList();
        
        renderPickupTabs();
        loadPickupInputs();

        // Attach Tab Drag Engines once
        setupTabDragManager('estimatorTabsContainer', 'estimatorTabsList', () => estimatorTabs, saveEstimatorTabs, renderEstimatorTabs);
        setupTabDragManager('pickupTabsContainer', 'pickupTabsList', () => pickupTabs, savePickupTabs, renderPickupTabs);
        setupTabDragManager('tabsContainer', 'tabsList', () => appTabs, saveTabs, renderTabs);
        
        // Attach Hold-to-delete-all logic
        setupAddButtonHold('estimatorTabsList', addNewEstimatorTab, () => {
            estimatorTabs = [{ id: 'etab_' + Date.now(), name: 'Line 1', unit: 'Pallets', remaining: '', data: [] }];
            activeEstimatorTabId = estimatorTabs[0].id;
            isEstimatorTabMenuOpen = false;
            saveEstimatorTabs();
            renderEstimatorTabs();
            loadEstimatorInputs();
            updateEstimatorTabMenuState();
        }, "Delete ALL records from the Production Estimator? This cannot be undone.");

        setupAddButtonHold('pickupTabsList', addNewPickupTab, () => {
            pickupTabs = [{ id: 'ptab_' + Date.now(), name: 'Sample 1', pre: '', post: '' }];
            activePickupTabId = pickupTabs[0].id;
            isPickupTabMenuOpen = false; 
            savePickupTabs();
            renderPickupTabs();
            loadPickupInputs();
            updatePickupTabMenuState(); 
        }, "Delete ALL samples from the Pickup Calculator? This cannot be undone.");
        
        setupAddButtonHold('tabsList', addNewTab, () => {
            appTabs = [{ id: 'tab_' + Date.now(), name: 'Sample 1', data: [] }];
            activeTabId = appTabs[0].id;
            isTabMenuOpen = false; 
            saveTabs();
            renderTabs();
            renderList();
            updateTabMenuState(); 
        }, "Delete ALL samples from Sum & Averaging? This cannot be undone.");
    });

    // ==========================================
    // ---- ROBUST TAB DRAG ENGINE --------------
    // ==========================================
    function setupTabDragManager(containerId, listId, getArrayFn, saveFn, renderFn) {
        const list = document.getElementById(listId);
        const container = document.getElementById(containerId);
        
        let holdTimer = null;
        let isDragging = false;
        let startX = 0, startY = 0;
        let dragIdx = -1;
        let itemWidth = 0;
        let elements = [];
        let startScrollLeft = 0;

        const startDrag = (e) => {
            const btn = e.target.closest('.tab-btn');
            if (!btn || btn.classList.contains('add-tab-btn')) return;
            if (e.type === 'mousedown' && e.button !== 0) return;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            startX = clientX;
            startY = clientY;
            startScrollLeft = container.scrollLeft;

            const arr = getArrayFn();
            dragIdx = arr.findIndex(t => t.id === btn.dataset.id);

            holdTimer = setTimeout(() => {
                isDragging = true;
                if ('vibrate' in navigator) { try { navigator.vibrate(50); } catch(err){} }

                elements = Array.from(list.querySelectorAll('.tab-btn:not(.add-tab-btn)'));
                const gap = parseInt(window.getComputedStyle(list).gap) || 4;
                itemWidth = elements[0].offsetWidth + gap;

                btn.style.transition = 'none';
                btn.style.zIndex = '100';
                btn.style.transform = 'scale(1.05)';
                btn.style.backgroundColor = '#f1f5f9';

                elements.forEach(el => {
                    if (el !== btn) el.style.transition = 'transform 0.2s ease';
                    el.dataset.offset = 0;
                });
            }, 400);
        };

        const moveDrag = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            if (!isDragging && holdTimer) {
                if (Math.abs(clientX - startX) > 10 || Math.abs(clientY - startY) > 10) {
                    clearTimeout(holdTimer);
                    holdTimer = null;
                }
                return;
            }

            if (isDragging) {
                e.preventDefault(); 
                const deltaX = clientX - startX;
                const scrollShift = container.scrollLeft - startScrollLeft;
                const totalMove = deltaX + scrollShift;

                elements[dragIdx].style.transform = `translateX(${totalMove}px) scale(1.05)`;

                let moveSteps = Math.round(totalMove / itemWidth);
                let targetIdx = Math.max(0, Math.min(elements.length - 1, dragIdx + moveSteps));

                elements.forEach((el, idx) => {
                    if (idx === dragIdx) return;
                    let offset = 0;
                    if (idx > dragIdx && idx <= targetIdx) offset = -itemWidth;
                    else if (idx < dragIdx && idx >= targetIdx) offset = itemWidth;
                    
                    if (el.dataset.offset != offset) {
                        el.style.transform = `translateX(${offset}px)`;
                        el.dataset.offset = offset;
                    }
                });

                const rect = container.getBoundingClientRect();
                if (clientX < rect.left + 50) container.scrollLeft -= 7;
                else if (clientX > rect.right - 50) container.scrollLeft += 7;
            }
        };

        const endDrag = (e) => {
            clearTimeout(holdTimer);
            holdTimer = null;

            if (isDragging) {
                isDragging = false;
                preventTabClick = true;
                setTimeout(() => preventTabClick = false, 150);

                const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                const deltaX = clientX - startX;
                const scrollShift = container.scrollLeft - startScrollLeft;
                const totalMove = deltaX + scrollShift;

                let moveSteps = Math.round(totalMove / itemWidth);
                let targetIdx = Math.max(0, Math.min(elements.length - 1, dragIdx + moveSteps));

                if (dragIdx !== targetIdx) {
                    const arr = getArrayFn();
                    const item = arr.splice(dragIdx, 1)[0];
                    arr.splice(targetIdx, 0, item);
                    saveFn();
                }
                renderFn();
            }
        };

        list.addEventListener('touchstart', startDrag, { passive: true });
        list.addEventListener('mousedown', startDrag);
        
        document.addEventListener('touchmove', moveDrag, { passive: false });
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('touchend', endDrag);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchcancel', endDrag);
    }

    function setupAddButtonHold(listId, addAction, resetAction, promptMessage) {
        const list = document.getElementById(listId);
        let holdTimer = null;
        let isHold = false;
        let startX = 0, startY = 0;

        const startHold = (e) => {
            const btn = e.target.closest('.add-tab-btn');
            if (!btn || (e.type === 'mousedown' && e.button !== 0)) return;
            
            isHold = false;
            startX = e.touches ? e.touches[0].clientX : e.clientX; 
            startY = e.touches ? e.touches[0].clientY : e.clientY;

            holdTimer = setTimeout(() => {
                isHold = true;
                if (navigator.vibrate) navigator.vibrate(50);
                if (confirm(promptMessage)) resetAction();
            }, 800);
        };

        const cancelHold = (e) => {
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
                const btn = e.target.closest('.add-tab-btn');
                if (btn && !isHold) {
                    preventTabClick = true;
                    setTimeout(() => preventTabClick = false, 150);
                    addAction(); 
                }
            }
        };

        list.addEventListener('touchstart', startHold, { passive: true });
        list.addEventListener('mousedown', startHold);
        list.addEventListener('touchmove', (e) => {
            if (holdTimer && (Math.abs(e.touches[0].clientX - startX) > 10 || Math.abs(e.touches[0].clientY - startY) > 10)) {
                clearTimeout(holdTimer); holdTimer = null;
            }
        }, { passive: true });
        
        list.addEventListener('touchend', cancelHold);
        list.addEventListener('mouseup', cancelHold);
        list.addEventListener('touchcancel', () => clearTimeout(holdTimer));
    }


    // ==========================================
    // ---- PRODUCTION ESTIMATOR LOGIC ----------
    // ==========================================
    let estimatorTabs = JSON.parse(localStorage.getItem('qc_estimator_tabs_data')) || [{ id: 'etab_' + Date.now(), name: 'Line 1', unit: 'Pallets', remaining: '', data: [] }];
    let activeEstimatorTabId = estimatorTabs[0].id;
    let isEstimatorTabMenuOpen = false;

    function saveEstimatorTabs() { localStorage.setItem('qc_estimator_tabs_data', JSON.stringify(estimatorTabs)); }
    function getActiveEstimator() { return estimatorTabs.find(t => t.id === activeEstimatorTabId); }

    function renderEstimatorTabs() {
        const list = document.getElementById('estimatorTabsList');
        list.innerHTML = '';
        let activeBtnElement = null;

        estimatorTabs.forEach((tab) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${tab.id === activeEstimatorTabId ? 'active' : ''}`;
            btn.innerText = tab.name;
            btn.dataset.id = tab.id; 
            
            if (tab.id === activeEstimatorTabId) activeBtnElement = btn;

            btn.onclick = (e) => {
                if (preventTabClick) { e.preventDefault(); e.stopPropagation(); return; }

                if (activeEstimatorTabId === tab.id) {
                    isEstimatorTabMenuOpen = !isEstimatorTabMenuOpen;
                    updateEstimatorTabMenuState();
                } else {
                    activeEstimatorTabId = tab.id;
                    isEstimatorTabMenuOpen = false;
                    renderEstimatorTabs();
                    loadEstimatorInputs();
                    updateEstimatorTabMenuState();
                }
            };
            list.appendChild(btn);
        });
        
        const addBtn = document.createElement('button');
        addBtn.className = 'add-tab-btn';
        addBtn.innerText = '+';
        list.appendChild(addBtn);
        
        setTimeout(() => {
            if (activeBtnElement && !preventTabClick) {
                activeBtnElement.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }, 10);
    }

    function updateEstimatorTabMenuState() {
        const panel = document.getElementById('estimatorTabOptionsPanel');
        if (isEstimatorTabMenuOpen) {
            const activeTab = getActiveEstimator();
            document.getElementById('renameEstimatorTabInput').value = activeTab.name;
            panel.style.display = 'flex';
        } else {
            panel.style.display = 'none';
        }
    }

    function saveEstimatorTabName() {
        const newName = document.getElementById('renameEstimatorTabInput').value.trim();
        if (newName !== '') {
            const tab = getActiveEstimator();
            tab.name = newName;
            saveEstimatorTabs();
            isEstimatorTabMenuOpen = false;
            renderEstimatorTabs();
            updateEstimatorTabMenuState();
        }
    }

    function confirmDeleteEstimatorTab() {
        const tab = getActiveEstimator();
        if (estimatorTabs.length === 1) {
            alert("You must have at least one line tracked.");
            return;
        }
        if (confirm(`Are you sure you want to delete "${tab.name}"?`)) {
            let currentIndex = estimatorTabs.findIndex(t => t.id === activeEstimatorTabId);
            estimatorTabs = estimatorTabs.filter(t => t.id !== activeEstimatorTabId);
            let newIndex = currentIndex - 1;
            if (newIndex < 0) newIndex = 0; 
            
            activeEstimatorTabId = estimatorTabs[newIndex].id; 
            isEstimatorTabMenuOpen = false;
            saveEstimatorTabs();
            renderEstimatorTabs();
            loadEstimatorInputs();
            updateEstimatorTabMenuState();
        }
    }

    function addNewEstimatorTab() {
        let maxNum = 0;
        estimatorTabs.forEach(t => {
            const match = t.name.match(/^Line (\d+)$/i);
            if (match) {
                const num = parseInt(match[1]);
                if (num > maxNum) maxNum = num;
            }
        });
        const nextNum = maxNum > 0 ? maxNum + 1 : estimatorTabs.length + 1;
        
        const newTab = { id: 'etab_' + Date.now(), name: `Line ${nextNum}`, unit: 'Pallets', remaining: '', data: [] };
        estimatorTabs.push(newTab);
        activeEstimatorTabId = newTab.id;
        isEstimatorTabMenuOpen = false;
        
        saveEstimatorTabs();
        renderEstimatorTabs();
        loadEstimatorInputs();
        updateEstimatorTabMenuState();
    }

    function updateEstimatorUnit() {
        const val = document.getElementById('estimatorUnitInput').value || 'Units';
        document.getElementById('lblEstimatorUnit').innerText = val;
        const tab = getActiveEstimator();
        tab.unit = val;
        saveEstimatorTabs();
        renderEstimatorList(); // Refresh labels in list
    }

    function loadEstimatorInputs() {
        const tab = getActiveEstimator();
        document.getElementById('estimatorUnitInput').value = tab.unit === 'Pallets' ? '' : tab.unit;
        document.getElementById('lblEstimatorUnit').innerText = tab.unit || 'Units';
        document.getElementById('estRemainingInput').value = tab.remaining || '';
        
        // Auto-populate time to right now
        setCurrentTime('estTimeInput');
        document.getElementById('estAmountInput').value = '';
        renderEstimatorList();
    }

    function setCurrentTime(id) {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById(id).value = `${h}:${m}`;
    }

    function addEstimatorEntry() {
        const amount = parseFloat(document.getElementById('estAmountInput').value);
        const time = document.getElementById('estTimeInput').value;
        if (isNaN(amount) || !time) return;

        const tab = getActiveEstimator();
        tab.data.push({ id: Date.now(), amount, time, checked: true });
        saveEstimatorTabs();
        
        document.getElementById('estAmountInput').value = '';
        setCurrentTime('estTimeInput'); 
        document.getElementById('estAmountInput').focus();
        
        renderEstimatorList();
    }

    function toggleEstimatorCheck(id) {
        const tab = getActiveEstimator();
        const entry = tab.data.find(e => e.id === id);
        if (entry) {
            entry.checked = !entry.checked;
            saveEstimatorTabs();
            renderEstimatorList();
        }
    }

    function removeEstimatorEntry(id) {
        const tab = getActiveEstimator();
        tab.data = tab.data.filter(e => e.id !== id);
        saveEstimatorTabs();
        renderEstimatorList();
    }

    function parseTimeToMinutes(timeStr) {
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m;
    }

    function formatMinutesToTime(totalMins) {
        let h = Math.floor(totalMins / 60) % 24;
        let m = Math.floor(totalMins % 60);
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    }

    function renderEstimatorList() {
        const container = document.getElementById('estimatorList');
        const tab = getActiveEstimator();
        container.innerHTML = '';
        
        if (tab.data.length === 0) {
            container.style.display = 'none';
            calculateEstimatorPace();
            return;
        }
        
        container.style.display = 'flex';

        // Sort data chronologically for clean visual output
        const sortedData = [...tab.data].sort((a,b) => parseTimeToMinutes(a.time) - parseTimeToMinutes(b.time));

        sortedData.forEach((entry) => {
            const div = document.createElement('div');
            div.className = 'number-item';
            div.style.padding = '8px';
            
            div.innerHTML = `
                <input type="checkbox" class="tick-box" ${entry.checked ? 'checked' : ''} onchange="toggleEstimatorCheck(${entry.id})">
                <div style="flex:1; display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size: 1.1rem;">
                    <span>${entry.amount} <span style="font-size:0.8rem; color:#64748b;">${tab.unit}</span></span>
                    <span style="color:var(--primary); font-family:monospace;">${entry.time}</span>
                </div>
                <button class="remove-btn" onclick="removeEstimatorEntry(${entry.id})" title="Remove" style="margin-left:10px;">&times;</button>
            `;
            container.appendChild(div);
        });
        
        calculateEstimatorPace();
    }

    function calculateEstimatorPace() {
        const tab = getActiveEstimator();
        const checkedEntries = tab.data.filter(e => e.checked);
        const paceRes = document.getElementById('estimatorPaceResult');
        const forecastBox = document.getElementById('estimatorForecastBox');
        const forecastRes = document.getElementById('estimatorForecastResult');
        
        const remInput = document.getElementById('estRemainingInput').value;
        tab.remaining = remInput;
        saveEstimatorTabs();

        if (checkedEntries.length < 2) {
            paceRes.style.display = 'block';
            paceRes.innerHTML = `<span style="font-size:0.85rem; color:#64748b;">Requires at least 2 checked points to calculate live pace.</span>`;
            forecastBox.style.display = 'none';
            return;
        }

        checkedEntries.sort((a, b) => parseTimeToMinutes(a.time) - parseTimeToMinutes(b.time));
        
        const first = checkedEntries[0];
        const last = checkedEntries[checkedEntries.length - 1];
        
        let timeDiffMins = parseTimeToMinutes(last.time) - parseTimeToMinutes(first.time);
        if (timeDiffMins <= 0) timeDiffMins += 24 * 60; // Handle Midnight roll-over
        
        const amountDiff = last.amount - first.amount;
        
        if (timeDiffMins === 0 || amountDiff === 0) {
            paceRes.style.display = 'block';
            paceRes.innerHTML = `<span style="font-size:0.85rem; color:#64748b;">Pace is stalled. Time/Amount hasn't changed.</span>`;
            forecastBox.style.display = 'none';
            return;
        }
        
        const pacePerHour = (amountDiff / timeDiffMins) * 60;
        
        paceRes.style.display = 'block';
        paceRes.innerHTML = `Live Pace: <strong>${pacePerHour.toFixed(2)} ${tab.unit} / hr</strong>`;
        
        forecastBox.style.display = 'block';
        
        const remaining = parseFloat(remInput);
        if (!isNaN(remaining) && remaining > 0 && pacePerHour > 0) {
            const minsNeeded = (remaining / pacePerHour) * 60;
            const finishTimeMins = parseTimeToMinutes(last.time) + minsNeeded;
            
            let finishStr = formatMinutesToTime(finishTimeMins);
            let dayStr = finishTimeMins >= 24 * 60 ? " <span style='font-size:0.75rem; color:#64748b;'>(Tomorrow)</span>" : "";
            
            forecastRes.style.display = 'block';
            forecastRes.innerHTML = `Projected Finish: <strong style="font-size:1.3rem; color:var(--primary); margin-left:5px;">${finishStr}</strong>${dayStr}`;
        } else {
            forecastRes.style.display = 'none';
        }
    }


    // ==========================================
    // ---- PICKUP TABS SYSTEM LOGIC ----
    // ==========================================
    let pickupTabs = JSON.parse(localStorage.getItem('qc_pickup_tabs_data')) || [{ id: 'ptab_' + Date.now(), name: 'Sample 1', pre: '', post: '' }];
    let activePickupTabId = pickupTabs[0].id;
    let isPickupTabMenuOpen = false;

    function savePickupTabs() {
        localStorage.setItem('qc_pickup_tabs_data', JSON.stringify(pickupTabs));
    }

    function renderPickupTabs() {
        const list = document.getElementById('pickupTabsList');
        list.innerHTML = '';
        let activeBtnElement = null;

        pickupTabs.forEach((tab) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${tab.id === activePickupTabId ? 'active' : ''}`;
            btn.innerText = tab.name;
            btn.dataset.id = tab.id; 
            
            if (tab.id === activePickupTabId) activeBtnElement = btn;

            btn.onclick = (e) => {

    function updateStopwatch() {
        let diff = swElapsed;
        if (isSwRunning) { diff += (Date.now() - swStartTime); }
        const m = Math.floor(diff / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        const ms = Math.floor((diff % 1000) / 10);
        swDisplay.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
    }

    function toggleStopwatch() {

        const toggleBtn = document.getElementById('toggleTimerBtn');
        if (isSwRunning) {
            clearInterval(swInterval);

            isSwRunning = false;
            swMode = null;
            updateStopwatch();
            toggleBtn.innerText = "Start";
            toggleBtn.style.backgroundColor = ""; 
        } else {
            swStartTime = Date.now();
            swInterval = setInterval(updateStopwatch, 10);
            isSwRunning = true;
            swMode = 'tap';
            toggleBtn.innerText = "Stop";
            toggleBtn.style.backgroundColor = "var(--accent)"; 
        }
    }

    function generateTime(isRecursive) {
        const minInput = document.getElementById('minMinutes');
        const maxInput = document.getElementById('maxMinutes');
        const startTimeInput = document.getElementById('startTime');
        const res = document.getElementById('timeResult');

        [minInput, maxInput, startTimeInput].forEach(el => el.classList.remove('input-error'));

        if (!isRecursive) {
            let errors = [];
            if (!minInput.value) { errors.push("Min Minutes"); minInput.classList.add('input-error'); }
            if (!maxInput.value) { errors.push("Max Minutes"); maxInput.classList.add('input-error'); }
            if (!startTimeInput.value) { errors.push("Start Time"); startTimeInput.classList.add('input-error'); }

            if (errors.length > 0) {
                res.style.display = "block";
                res.innerHTML = `<span style="color:var(--error); font-weight:bold;">Missing: ${errors.join(', ')}</span>`;
                
                setTimeout(() => {
                    if (res.innerHTML.includes("Missing:")) {
                        res.style.display = "none";
                        res.innerHTML = "";
                        [minInput, maxInput, startTimeInput].forEach(el => el.classList.remove('input-error'));
                    }
                }, 3500);
                return;
            }
        }

        const min = parseInt(minInput.value); 
        const max = parseInt(maxInput.value);
        let startStr = isRecursive ? lastGeneratedTimeStr : startTimeInput.value;
        
        const rand = Math.floor(Math.random() * (max - min + 1)) + min;
        const [h, m] = startStr.split(':').map(Number);
        
        let target = new Date();
        target.setHours(h, m + rand, 0, 0);
        if (target < new Date()) { target.setDate(target.getDate() + 1); }

        targetTimeObject = target;
        lastGeneratedTimeStr = `${String(target.getHours()).padStart(2,'0')}:${String(target.getMinutes()).padStart(2,'0')}`;
        
        res.style.display = "block";
        res.innerHTML = `
            <div style="font-size:0.85rem;color:#64748b;">Reference: ${startStr} (+${rand}m)</div>
            <div style="font-weight:bold;color:var(--primary);font-size:1.4rem;">Target: ${lastGeneratedTimeStr}</div>
            <button class="btn-recursive" onclick="generateTime(true)">Next window from ${lastGeneratedTimeStr}</button>
        `;
        
        document.getElementById('timerControls').style.display = 'block';
        document.getElementById('clearTimeBtn').style.display = 'block';
    }

    function handleStartTimer() {
        if (Notification.permission === "default") Notification.requestPermission();
        if (timerInterval && !confirm("An active timer is already running. Override it?")) return;
        if (targetTimeObject) startTimer(targetTimeObject);
    }

    function startTimer(targetDate) {
        stopTimer();
        const display = document.getElementById('countdown');
        const cancelBtn = document.getElementById('cancelTimerBtn');
        const stopBtn = document.getElementById('stopAlarmBtn');
        
        document.getElementById('activeTimer').style.display = 'block';
        display.classList.add('timer-active');
        cancelBtn.style.display = 'block';
        stopBtn.style.display = 'none';

        timerInterval = setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate.getTime() - now;

            if (distance < 0) {
                triggerFinalAlarm();
                return;
            }

            const h = Math.floor((distance % 86400000) / 3600000);
            const m = Math.floor((distance % 3600000) / 60000);
            const s = Math.floor((distance % 60000) / 1000);
            display.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }, 1000);
    }

    async function triggerFinalAlarm() {
        clearInterval(timerInterval);
        timerInterval = null;
        
        const display = document.getElementById('countdown');
        display.innerText = "TIME UP!";
        display.style.color = "var(--error)";
        document.getElementById('cancelTimerBtn').style.display = 'none';
        document.getElementById('stopAlarmBtn').style.display = 'block';

        alarm.play().catch(e => console.log("Audio block."));
        
        if ("vibrate" in navigator) {
            navigator.vibrate([500, 200, 500, 200, 500]);
            vibrationInterval = setInterval(() => {
                try { navigator.vibrate([500, 200, 500, 200, 500]); } catch(e){}
            }, 2000);
        }

        if (Notification.permission === "granted") {
            try {
                const reg = await navigator.serviceWorker.ready;
                await reg.showNotification("QC ALERT: COLLECT SAMPLES!", { 
                    body: "Tap to stop the alarm.", 
                    requireInteraction: true,
                    vibrate: [500, 200, 500, 200, 500],
                    icon: "https://cdn-icons-png.flaticon.com/512/1162/1162456.png",
                    tag: 'qc-alert' 
                });
            } catch (err) {
                console.log("Notification failed", err);
            }
        }
    }

    async function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        
        if (vibrationInterval) {
            clearInterval(vibrationInterval);
            vibrationInterval = null;
        }
        if ("vibrate" in navigator) { try { navigator.vibrate(0); } catch(e){} }

        alarm.pause();

        document.getElementById('activeTimer').style.display = 'none';

        } catch(e) {}
    }

    function onListPointerMove(e) {
        if (listDraggingIdx === null) return;
        const deltaY = e.clientY - listStartY;
        const draggedEl = listElements[listDraggingIdx];
        draggedEl.style.transform = `translateY(${deltaY}px)`;

        let moveSteps = Math.round(deltaY / listRowHeight);
        let targetIdx = listDraggingIdx + moveSteps;
        targetIdx = Math.max(0, Math.min(listElements.length - 1, targetIdx));

        listElements.forEach((el, idx) => {
            if (idx === listDraggingIdx) return;
            let offset = 0;
            if (idx > listDraggingIdx && idx <= targetIdx) offset = -listRowHeight;
            else if (idx < listDraggingIdx && idx >= targetIdx) offset = listRowHeight;
            
            if (el.dataset.offset != offset) {
                el.style.transform = `translateY(${offset}px)`;
                el.dataset.offset = offset;
            }
        });
    }

    function onListPointerUp(e) {
        if (listDraggingIdx === null) return;
        const deltaY = e.clientY - listStartY;
        let moveSteps = Math.round(deltaY / listRowHeight);
        let targetIdx = listDraggingIdx + moveSteps;
        targetIdx = Math.max(0, Math.min(listElements.length - 1, targetIdx));

        if (listDraggingIdx !== targetIdx) {
            const arr = getActiveData();
            const item = arr.splice(listDraggingIdx, 1)[0];
            arr.splice(targetIdx, 0, item);
            saveTabs();
        }

        listDraggingIdx = null;
        document.removeEventListener('pointermove', onListPointerMove);
        document.removeEventListener('pointerup', onListPointerUp);
        document.removeEventListener('pointercancel', onListPointerUp);
        renderList();
    }

    function renderList() {
        const container = document.getElementById('numberList');
        const clearBtn = document.getElementById('clearAllBtn');
        const arr = getActiveData();
        const activeTab = appTabs.find(t => t.id === activeTabId);
        
        container.innerHTML = '';
        container.style.display = arr.length ? "flex" : "none";
        clearBtn.style.display = arr.length ? "block" : "none";
        
        if (activeTab) {
            clearBtn.innerText = `Clear ${activeTab.name}`;
        }
        
        arr.forEach((n, i) => {
            const div = document.createElement('div');
            div.className = 'number-item';
            div.innerHTML = `
                <div class="drag-handle" title="Drag to reorder">&#x2261;</div>
                <input type="number" class="edit-input" value="${n}" onchange="updateNumber(${i}, this); this.blur();" inputmode="decimal">
                <button class="remove-btn" onclick="removeNumber(${i})" title="Remove">&times;</button>
            `;

            const handle = div.querySelector('.drag-handle');
            const inputField = div.querySelector('.edit-input');

            handle.addEventListener('pointerdown', (e) => {
                document.activeElement.blur(); 
                listDraggingIdx = i;
                listStartY = e.clientY;
                listElements = Array.from(container.children);
                
                const gap = parseInt(window.getComputedStyle(container).gap) || 8;
                listRowHeight = listElements[0].offsetHeight + gap;
                
                listElements.forEach((el) => {
                    el.style.transition = 'transform 0.2s cubic-bezier(0.2, 0, 0, 1)';
                    el.dataset.offset = 0;
                });
                
                div.style.transition = 'none'; 
                div.classList.add('dragging');
                inputField.style.pointerEvents = 'none'; 
                
                document.addEventListener('pointermove', onListPointerMove);
                document.addEventListener('pointerup', onListPointerUp);
                document.addEventListener('pointercancel', onListPointerUp);
            });

            container.appendChild(div);
        });
        updateStats();
    }

    }

    function calculateSalinity() {
        const brix = parseFloat(document.getElementById('brixVal').value); if (isNaN(brix)) return;
        const res = document.getElementById('salinityResult'); res.style.display = "block";
        res.innerHTML = `Salinity: <strong>${((brix / 26.4) * 100).toFixed(2)}%</strong>`;
        document.getElementById('clearSalinityBtn').style.display = 'block';
    }

    function resetSalinity() {
        document.getElementById('brixVal').value = ''; document.getElementById('salinityResult').style.display = 'none';
        document.getElementById('clearSalinityBtn').style.display = 'none';
    }
</script>
</body>
</html>
