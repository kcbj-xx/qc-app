<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QC Toolset Pro</title>
    
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1162/1162456.png">
    
    <link rel="manifest" id="pwa-manifest">

    <style>
        :root { 
            --primary: #2563eb; 
            --primary-hover: #1d4ed8; 
            --bg: #f3f4f6; 
            --card-bg: #ffffff; 
            --text: #1f2937; 
            --border: #e5e7eb; 
            --accent: #d97706; 
            --success: #10b981;
            --error: #ef4444;
        }
        
        body { overscroll-behavior-y: contain; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 20px; padding-bottom: 50px; }
        .card { background-color: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 1.25rem; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .row { display: flex; gap: 15px; } .row .input-group { flex: 1; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 0.875rem; }
        input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; width: 100%; box-sizing: border-box; transition: border-color 0.3s; }
        input.input-error { border: 2px solid var(--error); background-color: #fff1f2; }
        
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; -webkit-tap-highlight-color: transparent; margin-bottom: 8px; }
        button:hover { background-color: var(--primary-hover); }
        button.secondary { background-color: var(--error); width: 100%; margin-top: 10px; }
        
        .btn-timer-start { background-color: #8b5cf6; }
        .btn-timer-start:hover { background-color: #7c3aed; }
        
        .timer-display { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 2rem; font-weight: bold; margin-top: 10px; text-align: center; border: 2px solid #334155; transition: all 0.3s; }
        .timer-active { border-color: var(--success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .timer-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        
        .result { margin-top: 15px; padding: 15px; background-color: #f8fafc; border-radius: 8px; border: 1px solid var(--border); font-size: 1.1rem; text-align: center; }
        .glaze-pct { color: var(--accent); font-weight: 800; font-size: 1.3rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 15px 0; text-align: center; }
        .stat-box { background-color: #f8fafc; border: 1px solid var(--border); padding: 10px; border-radius: 8px; }
        .stat-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; font-weight: bold; }
        .stat-value { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        
        /* Reorderable List Styles */
        .drag-container { display: none; flex-direction: column; gap: 8px; margin: 15px 0; max-height: 350px; overflow-y: auto; border-radius: 8px; padding: 4px; }
        .number-item { display: flex; align-items: center; background: #fff; border: 1px solid var(--border); padding: 6px 12px 6px 6px; border-radius: 8px; gap: 10px; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        
        .reorder-controls { display: flex; flex-direction: column; gap: 3px; }
        .reorder-btn { background: #f8fafc; border: 1px solid var(--border); color: #64748b; width: 32px; height: 22px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0; padding: 0; box-sizing: border-box; }
        .reorder-btn:hover:not(:disabled) { background: #e2e8f0; color: var(--primary); border-color: #cbd5e1; }
        .reorder-btn:disabled { opacity: 0.2; background: transparent; border-color: transparent; cursor: default; }
        
        .item-index { font-size: 0.85rem; color: #94a3b8; font-weight: bold; width: 20px; text-align: center; }
        .edit-input { flex: 1; border: 1px solid transparent; background: transparent; font-weight: 600; font-size: 1.1rem; padding: 4px; }
        .edit-input:focus { border-bottom: 2px solid var(--primary); outline: none; border-radius: 0; }
        
        .remove-btn { background: #fee2e2; color: #ef4444; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; padding: 0; line-height: 1; }
        .last-added-text { font-size: 0.85rem; color: var(--success); font-weight: 600; margin-top: 5px; height: 1.2em; }
        .btn-recursive { background-color: var(--success); margin-top: 8px; font-size: 0.95rem; }
        
        @media (max-width: 480px) { .row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>

<div class="container">
    <!-- Sampling Time Card -->
    <div class="card">
        <h2>Sampling Time from Main</h2>
        <div class="row">
            <div class="input-group">
                <label>Min Mins</label>
                <input type="number" id="minMinutes" placeholder="e.g. 40" inputmode="numeric">
            </div>
            <div class="input-group">
                <label>Max Mins</label>
                <input type="number" id="maxMinutes" placeholder="e.g. 60" inputmode="numeric">
            </div>
        </div>
        <div class="input-group">
            <label>Start Time</label>
            <input type="time" id="startTime">
        </div>
        
        <button onclick="generateTime(false)">Generate Time</button>
        
        <div id="timeResult" class="result" style="display: none;"></div>

        <div id="timerControls" style="display: none; margin-top: 15px;">
            <button class="btn-timer-start" onclick="handleStartTimer()">Start Countdown</button>
        </div>

        <div id="activeTimer" style="display: none; margin-top: 15px;">
            <div class="timer-label">Time Remaining</div>
            <div class="timer-display" id="countdown">00:00:00</div>
            <button class="secondary" id="stopAlarmBtn" onclick="stopTimer()" style="display: none;">Stop Alarm</button>
            <button class="secondary" id="cancelTimerBtn" onclick="stopTimer()">Cancel Timer</button>
        </div>

        <button id="clearTimeBtn" class="secondary" onclick="resetSamplingTime()" style="display: none;">Clear All</button>
    </div>

    <!-- Glaze Calculator Card -->
    <div class="card">
        <h2>Glaze Calculator</h2>
        <div class="row">
            <div class="input-group"><label>Glazed</label><input type="number" step="any" id="glazedVal" inputmode="decimal"></div>
            <div class="input-group"><label>Deglazed</label><input type="number" step="any" id="deglazeVal" inputmode="decimal"></div>
        </div>
        <button onclick="calculateGlaze()">Calculate Glaze</button>
        <button id="clearGlazeBtn" class="secondary" onclick="resetGlaze()" style="display: none;">Clear</button>
        <div class="result" id="glazeResult" style="display: none;"></div>
    </div>

    <!-- Averaging Card -->
    <div class="card">
        <h2>Averaging & Sum</h2>
        <div class="stats-grid">
            <div class="stat-box"><div class="stat-label">Count</div><div class="stat-value" id="statCount">0</div></div>
            <div class="stat-box"><div class="stat-label">Sum</div><div class="stat-value" id="statSum">0</div></div>
            <div class="stat-box"><div class="stat-label">Avg</div><div class="stat-value" id="statAvg">0</div></div>
        </div>
        <div class="input-group">
            <label>Add Number</label>
            <div style="display: flex; gap: 10px;">
                <input type="number" step="any" id="numberInput" inputmode="decimal" placeholder="0.00" onkeypress="if(event.key==='Enter')addNumber()">
                <button onclick="addNumber()" style="width: auto;">Add</button>
            </div>
            <div class="last-added-text" id="lastAddedDisplay"></div>
        </div>
        <div id="numberList" class="drag-container"></div>
        <button id="clearAllBtn" class="secondary" onclick="clearNumbers()" style="display:none;">Clear All List</button>
    </div>

    <!-- Salinity Card -->
    <div class="card">
        <h2>Salinity Calculator</h2>
        <div class="input-group">
            <label>Brix Value</label>
            <input type="number" step="any" id="brixVal" inputmode="decimal" placeholder="Enter Brix">
        </div>
        <button onclick="calculateSalinity()">Calculate Salinity</button>
        <button id="clearSalinityBtn" class="secondary" onclick="resetSalinity()" style="display: none;">Clear</button>
        <div class="result" id="salinityResult" style="display: none;"></div>
    </div>
</div>

<audio id="alarmSound" loop preload="auto">
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<script>
    // PWA Manifest
    const manifest = {
        "name": "QC Toolset Pro",
        "short_name": "QC Tool",
        "start_url": ".",
        "display": "standalone",
        "background_color": "#f3f4f6",
        "theme_color": "#2563eb",
        "icons": [{
            "src": "https://cdn-icons-png.flaticon.com/512/1162/1162456.png",
            "sizes": "512x512",
            "type": "image/png",
            "purpose": "any maskable"
        }]
    };
    
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    document.querySelector('#pwa-manifest').setAttribute('href', manifestURL);

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch((err) => console.error("SW Failed:", err));
        });
    }

    let lastGeneratedTimeStr = "";
    let targetTimeObject = null;
    let timerInterval = null;
    const alarm = document.getElementById('alarmSound');

    function generateTime(isRecursive) {
        const minInput = document.getElementById('minMinutes');
        const maxInput = document.getElementById('maxMinutes');
        const startTimeInput = document.getElementById('startTime');
        const res = document.getElementById('timeResult');

        [minInput, maxInput, startTimeInput].forEach(el => el.classList.remove('input-error'));

        if (!isRecursive) {
            let errors = [];
            if (!minInput.value) { errors.push("Min Minutes"); minInput.classList.add('input-error'); }
            if (!maxInput.value) { errors.push("Max Minutes"); maxInput.classList.add('input-error'); }
            if (!startTimeInput.value) { errors.push("Start Time"); startTimeInput.classList.add('input-error'); }

            if (errors.length > 0) {
                res.style.display = "block";
                res.innerHTML = `<span style="color:var(--error); font-weight:bold;">Missing: ${errors.join(', ')}</span>`;
                
                // Hide text AND remove red borders automatically after 3.5 seconds
                setTimeout(() => {
                    if (res.innerHTML.includes("Missing:")) {
                        res.style.display = "none";
                        res.innerHTML = "";
                        [minInput, maxInput, startTimeInput].forEach(el => el.classList.remove('input-error'));
                    }
                }, 3500);
                return;
            }
        }

        const min = parseInt(minInput.value); 
        const max = parseInt(maxInput.value);
        let startStr = isRecursive ? lastGeneratedTimeStr : startTimeInput.value;
        
        const rand = Math.floor(Math.random() * (max - min + 1)) + min;
        const [h, m] = startStr.split(':').map(Number);
        
        let target = new Date();
        target.setHours(h, m + rand, 0, 0);
        if (target < new Date()) { target.setDate(target.getDate() + 1); }

        targetTimeObject = target;
        lastGeneratedTimeStr = `${String(target.getHours()).padStart(2,'0')}:${String(target.getMinutes()).padStart(2,'0')}`;
        
        res.style.display = "block";
        res.innerHTML = `
            <div style="font-size:0.85rem;color:#64748b;">Reference: ${startStr} (+${rand}m)</div>
            <div style="font-weight:bold;color:var(--primary);font-size:1.4rem;">Target: ${lastGeneratedTimeStr}</div>
            <button class="btn-recursive" onclick="generateTime(true)">Next window from ${lastGeneratedTimeStr}</button>
        `;
        
        document.getElementById('timerControls').style.display = 'block';
        document.getElementById('clearTimeBtn').style.display = 'block';
    }

    function handleStartTimer() {
        if (Notification.permission === "default") Notification.requestPermission();
        if (timerInterval && !confirm("An active timer is already running. Override it?")) return;
        if (targetTimeObject) startTimer(targetTimeObject);
    }

    function startTimer(targetDate) {
        stopTimer();
        const display = document.getElementById('countdown');
        const cancelBtn = document.getElementById('cancelTimerBtn');
        const stopBtn = document.getElementById('stopAlarmBtn');
        
        document.getElementById('activeTimer').style.display = 'block';
        display.classList.add('timer-active');
        cancelBtn.style.display = 'block';
        stopBtn.style.display = 'none';

        timerInterval = setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate.getTime() - now;

            if (distance < 0) {
                triggerFinalAlarm();
                return;
            }

            const h = Math.floor((distance % 86400000) / 3600000);
            const m = Math.floor((distance % 3600000) / 60000);
            const s = Math.floor((distance % 60000) / 1000);
            display.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }, 1000);
    }

    async function triggerFinalAlarm() {
        clearInterval(timerInterval);
        timerInterval = null;
        
        const display = document.getElementById('countdown');
        display.innerText = "TIME UP!";
        display.style.color = "var(--error)";
        document.getElementById('cancelTimerBtn').style.display = 'none';
        document.getElementById('stopAlarmBtn').style.display = 'block';

        alarm.play().catch(e => console.log("Audio block."));
        if ("vibrate" in navigator) navigator.vibrate([500, 200, 500, 200, 500]);

        if (Notification.permission === "granted") {
            try {
                const reg = await navigator.serviceWorker.ready;
                await reg.showNotification("QC Alert", { 
                    body: "Time to collect samples!", 
                    requireInteraction: true, 
                    vibrate: [200, 100, 200],
                    icon: "https://cdn-icons-png.flaticon.com/512/1162/1162456.png",
                    tag: 'qc-alert-' + Date.now() 
                });
            } catch (err) {
                new Notification("QC Alert (Fallback)", { 
                    body: "Time to collect samples!",
                    icon: "https://cdn-icons-png.flaticon.com/512/1162/1162456.png"
                });
            }
        }
    }

    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        alarm.pause();
        alarm.currentTime = 0;
        document.getElementById('activeTimer').style.display = 'none';
        document.getElementById('countdown').style.color = "#38bdf8";
        document.getElementById('countdown').classList.remove('timer-active');
    }

    function resetSamplingTime() {
        if (timerInterval && !confirm("Cancel current timer and clear data?")) return;
        stopTimer();
        document.getElementById('minMinutes').value = '';
        document.getElementById('maxMinutes').value = '';
        document.getElementById('startTime').value = '';
        document.getElementById('timeResult').style.display = 'none';
        document.getElementById('timerControls').style.display = 'none';
        document.getElementById('clearTimeBtn').style.display = 'none';
        lastGeneratedTimeStr = "";
        targetTimeObject = null;
    }

    function calculateGlaze() {
        const g=parseFloat(document.getElementById('glazedVal').value);
        const d=parseFloat(document.getElementById('deglazeVal').value);
        if(!g||!d) return;
        const dec=(g-d)/g;
        const res=document.getElementById('glazeResult');
        res.style.display="block";
        res.innerHTML=`Decimal: <strong>${dec.toFixed(4)}</strong> | <span class="glaze-pct">${(dec * 100).toFixed(2)}%</span>`;
        document.getElementById('clearGlazeBtn').style.display = 'block';
    }

    function resetGlaze() {
        document.getElementById('glazedVal').value = ''; document.getElementById('deglazeVal').value = '';
        document.getElementById('glazeResult').style.display = 'none'; document.getElementById('clearGlazeBtn').style.display = 'none';
    }

    let numbers = [];

    function addNumber() {
        const inp=document.getElementById('numberInput');
        const val=parseFloat(inp.value); if(isNaN(val)) return;
        document.getElementById('lastAddedDisplay').innerText=`Last added: ${val}`;
        numbers.push(val); 
        inp.value=''; 
        renderList();
        inp.focus(); 
    }

    function moveItem(index, direction) {
        if (index + direction < 0 || index + direction >= numbers.length) return;
        const item = numbers.splice(index, 1)[0];
        numbers.splice(index + direction, 0, item);
        renderList();
    }

    function renderList() {
        const container = document.getElementById('numberList');
        const clearBtn = document.getElementById('clearAllBtn');
        container.innerHTML = '';
        container.style.display = numbers.length ? "flex" : "none";
        clearBtn.style.display = numbers.length ? "block" : "none";
        
        numbers.forEach((n, i) => {
            const div = document.createElement('div');
            div.className = 'number-item';
            
            div.innerHTML = `
                <div class="reorder-controls">
                    <button class="reorder-btn" onclick="moveItem(${i}, -1)" ${i === 0 ? 'disabled' : ''} title="Move Up">&#9650;</button>
                    <button class="reorder-btn" onclick="moveItem(${i}, 1)" ${i === numbers.length - 1 ? 'disabled' : ''} title="Move Down">&#9660;</button>
                </div>
                <div class="item-index">${i + 1}.</div>
                <input type="number" class="edit-input" value="${n}" onchange="numbers[${i}]=parseFloat(this.value);updateStats();" inputmode="decimal">
                <button class="remove-btn" onclick="numbers.splice(${i},1);renderList();" title="Remove">&times;</button>
            `;

            container.appendChild(div);
        });
        updateStats();
    }

    function clearNumbers() { 
        if (confirm("Clear all numbers?")) { 
            numbers = []; 
            document.getElementById('lastAddedDisplay').innerText = ''; 
            renderList(); 
        } 
    }

    function updateStats() {
        const sum = numbers.reduce((a, b) => a + b, 0);
        document.getElementById('statCount').innerText = numbers.length;
        document.getElementById('statSum').innerText = sum.toFixed(2).replace(/\.00$/, '');
        document.getElementById('statAvg').innerText = (numbers.length ? (sum / numbers.length) : 0).toFixed(2).replace(/\.00$/, '');
    }

    function calculateSalinity() {
        const brix = parseFloat(document.getElementById('brixVal').value); if (isNaN(brix)) return;
        const res = document.getElementById('salinityResult'); res.style.display = "block";
        res.innerHTML = `Salinity: <strong>${((brix / 26.4) * 100).toFixed(2)}%</strong>`;
        document.getElementById('clearSalinityBtn').style.display = 'block';
    }

    function resetSalinity() {
        document.getElementById('brixVal').value = ''; document.getElementById('salinityResult').style.display = 'none';
        document.getElementById('clearSalinityBtn').style.display = 'none';
    }
</script>
</body>
</html>
