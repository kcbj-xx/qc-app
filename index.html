<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QC Toolset Pro</title>
    
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    
    <style>
        :root { 
            --primary: #2563eb; 
            --primary-hover: #1d4ed8; 
            --bg: #f3f4f6; 
            --card-bg: #ffffff; 
            --text: #1f2937; 
            --border: #e5e7eb; 
            --accent: #d97706; 
            --success: #10b981;
            --error: #ef4444;
        }
        
        body { overscroll-behavior-y: contain; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 20px; padding-bottom: 50px; }
        .card { background-color: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 1.25rem; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .row { display: flex; gap: 15px; } .row .input-group { flex: 1; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 0.875rem; }
        input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; width: 100%; box-sizing: border-box; }
        
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; -webkit-tap-highlight-color: transparent; margin-bottom: 8px; }
        button:hover { background-color: var(--primary-hover); }
        button.secondary { background-color: var(--error); width: 100%; margin-top: 10px; }
        
        .timer-display { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 2rem; font-weight: bold; margin-top: 10px; text-align: center; border: 2px solid #334155; }
        .timer-active { border-color: var(--success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        
        .result { margin-top: 15px; padding: 15px; background-color: #f8fafc; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
        
        /* Drag and Drop Styles */
        .drag-container { display: none; flex-direction: column; gap: 8px; margin: 15px 0; }
        .number-item { 
            display: flex; 
            align-items: center; 
            background: #fff; 
            border: 1px solid var(--border); 
            padding: 8px 12px; 
            border-radius: 8px; 
            gap: 10px; 
            cursor: grab;
            transition: transform 0.1s;
        }
        .number-item.dragging { opacity: 0.5; background: #e0f2fe; border: 1px dashed var(--primary); }
        .edit-input { flex: 1; border: none; background: transparent; font-weight: 600; font-size: 1rem; }
        
        .remove-btn { background: #fee2e2; color: #ef4444; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; text-align: center; }
        .stat-box { background-color: #f8fafc; border: 1px solid var(--border); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Timer Section -->
    <div class="card">
        <h2>Sampling Time</h2>
        <div class="row">
            <div class="input-group"><label>Min Mins</label><input type="number" id="minMinutes" placeholder="40"></div>
            <div class="input-group"><label>Max Mins</label><input type="number" id="maxMinutes" placeholder="60"></div>
        </div>
        <div class="input-group"><label>Start Time</label><input type="time" id="startTime"></div>
        <button onclick="generateTime(false)">Generate Time</button>
        <div id="timeResult" class="result" style="display: none;"></div>
        <div id="activeTimer" style="display: none; margin-top: 15px;">
            <div class="timer-display" id="countdown">00:00:00</div>
            <button class="secondary" id="stopAlarmBtn" onclick="stopTimer()" style="display: none;">Stop Alarm</button>
            <button class="secondary" id="cancelTimerBtn" onclick="stopTimer()">Cancel Timer</button>
        </div>
    </div>

    <!-- Glaze Calculator -->
    <div class="card">
        <h2>Glaze Calculator</h2>
        <div class="row">
            <div class="input-group"><label>Glazed</label><input type="number" step="any" id="glazedVal"></div>
            <div class="input-group"><label>Deglazed</label><input type="number" step="any" id="deglazeVal"></div>
        </div>
        <button onclick="calculateGlaze()">Calculate Glaze</button>
        <div class="result" id="glazeResult" style="display: none;"></div>
    </div>

    <!-- Averaging & Drag/Drop Section -->
    <div class="card">
        <h2>Averaging & Sum</h2>
        <div class="stats-grid">
            <div class="stat-box"><small>Count</small><div id="statCount">0</div></div>
            <div class="stat-box"><small>Sum</small><div id="statSum">0</div></div>
            <div class="stat-box"><small>Avg</small><div id="statAvg">0</div></div>
        </div>
        <div style="display: flex; gap: 10px;">
            <input type="number" step="any" id="numberInput" placeholder="0.00">
            <button onclick="addNumber()" style="width: auto;">Add</button>
        </div>
        <div id="numberList" class="drag-container"></div>
        <button id="clearAllBtn" class="secondary" onclick="clearNumbers()" style="display:none;">Clear List</button>
    </div>
</div>

<audio id="alarmSound" loop preload="auto">
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<script>
    // --- SERVICE WORKER & NOTIFICATIONS ---
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    if ("Notification" in window && Notification.permission === "default") { Notification.requestPermission(); }

    let lastGeneratedTimeStr = "";
    let targetTimeObject = null;
    let timerInterval = null;
    let wakeLock = null;
    const alarm = document.getElementById('alarmSound');

    // --- TIMER LOGIC ---
    function generateTime(isRecursive) {
        const min = parseInt(document.getElementById('minMinutes').value);
        const max = parseInt(document.getElementById('maxMinutes').value);
        let startStr = isRecursive ? lastGeneratedTimeStr : document.getElementById('startTime').value;
        if (!min || !max || !startStr) return;

        const rand = Math.floor(Math.random() * (max - min + 1)) + min;
        const [h, m] = startStr.split(':').map(Number);
        let target = new Date();
        target.setHours(h, m + rand, 0, 0);
        if (target < new Date()) target.setDate(target.getDate() + 1);

        targetTimeObject = target;
        lastGeneratedTimeStr = `${String(target.getHours()).padStart(2,'0')}:${String(target.getMinutes()).padStart(2,'0')}`;
        
        const res = document.getElementById('timeResult');
        res.style.display = "block";
        res.innerHTML = `<strong>Target: ${lastGeneratedTimeStr}</strong><br><button onclick="startTimerUI()" style="margin-top:10px; background:#8b5cf6;">Start Timer</button>`;
    }

    async function startTimerUI() {
        if (timerInterval) clearInterval(timerInterval);
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        
        document.getElementById('activeTimer').style.display = 'block';
        document.getElementById('stopAlarmBtn').style.display = 'none';
        document.getElementById('cancelTimerBtn').style.display = 'block';

        timerInterval = setInterval(() => {
            const distance = targetTimeObject.getTime() - new Date().getTime();
            if (distance < 0) {
                triggerAlarm();
                return;
            }
            const h = Math.floor((distance % 86400000) / 3600000);
            const m = Math.floor((distance % 3600000) / 60000);
            const s = Math.floor((distance % 60000) / 1000);
            document.getElementById('countdown').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }, 1000);
    }

    function triggerAlarm() {
        clearInterval(timerInterval);
        document.getElementById('countdown').innerText = "TIME UP!";
        document.getElementById('stopAlarmBtn').style.display = 'block';
        document.getElementById('cancelTimerBtn').style.display = 'none';
        
        // Force volume to max and play
        alarm.volume = 1.0; 
        alarm.play();

        // Device Vibration pulse
        if ("vibrate" in navigator) { navigator.vibrate([500, 200, 500, 200, 500]); }

        if (Notification.permission === "granted") {
            navigator.serviceWorker.ready.then(reg => {
                reg.showNotification("QC Alert", { body: "Sample Time Reached!", requireInteraction: true });
            });
        }
    }

    function stopTimer() {
        clearInterval(timerInterval);
        alarm.pause(); alarm.currentTime = 0;
        if (wakeLock) { wakeLock.release(); wakeLock = null; }
        document.getElementById('activeTimer').style.display = 'none';
    }

    // --- GLAZE CALC ---
    function calculateGlaze() {
        const g = parseFloat(document.getElementById('glazedVal').value);
        const d = parseFloat(document.getElementById('deglazeVal').value);
        if (!g || !d) return;
        const res = ((g - d) / g) * 100;
        const out = document.getElementById('glazeResult');
        out.style.display = "block";
        out.innerHTML = `Glaze: <strong>${res.toFixed(2)}%</strong>`;
    }

    // --- AVERAGING & DRAG/DROP LOGIC ---
    let numbers = [];

    function addNumber() {
        const inp = document.getElementById('numberInput');
        const val = parseFloat(inp.value);
        if (isNaN(val)) return;
        numbers.push(val);
        inp.value = "";
        renderList();
    }

    function renderList() {
        const container = document.getElementById('numberList');
        container.innerHTML = "";
        container.style.display = numbers.length ? "flex" : "none";
        document.getElementById('clearAllBtn').style.display = numbers.length ? "block" : "none";

        numbers.forEach((num, index) => {
            const item = document.createElement('div');
            item.className = 'number-item';
            item.draggable = true;
            item.dataset.index = index;
            item.innerHTML = `
                <span style="color:#94a3b8">☰</span>
                <input type="number" class="edit-input" value="${num}" onchange="updateNum(${index}, this.value)">
                <button class="remove-btn" onclick="removeNum(${index})">&times;</button>
            `;

            // Drag Events
            item.addEventListener('dragstart', () => item.classList.add('dragging'));
            item.addEventListener('dragend', () => item.classList.remove('dragging'));
            container.appendChild(item);
        });

        // Drop Logic
        container.addEventListener('dragover', e => {
            e.preventDefault();
            const draggingItem = document.querySelector('.dragging');
            const siblings = [...container.querySelectorAll('.number-item:not(.dragging)')];
            let nextSibling = siblings.find(sibling => e.clientY <= sibling.offsetTop + sibling.offsetHeight / 2);
            container.insertBefore(draggingItem, nextSibling);
        });

        container.addEventListener('drop', e => {
            e.preventDefault();
            const newOrder = [...container.querySelectorAll('.number-item')].map(el => parseFloat(el.querySelector('input').value));
            numbers = newOrder;
            updateStats();
        });

        updateStats();
    }

    function updateNum(i, v) { numbers[i] = parseFloat(v); updateStats(); }
    function removeNum(i) { numbers.splice(i, 1); renderList(); }
    function clearNumbers() { numbers = []; renderList(); }

    function updateStats() {
        const sum = numbers.reduce((a, b) => a + b, 0);
        document.getElementById('statCount').innerText = numbers.length;
        document.getElementById('statSum').innerText = sum.toFixed(2);
        document.getElementById('statAvg').innerText = numbers.length ? (sum / numbers.length).toFixed(3) : 0;
    }
</script>
</body>
</html>
