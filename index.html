<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QC Toolset Pro</title>
    
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1162/1162456.png">
    
    <link rel="manifest" href='data:application/manifest+json,%7B%22name%22%3A%22QC%20Toolset%20Pro%22%2C%22short_name%22%3A%22QC%20Tool%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f3f4f6%22%2C%22theme_color%22%3A%22%232563eb%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F1162%2F1162456.png%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D'>

    <style>
        :root { 
            --primary: #2563eb; 
            --primary-hover: #1d4ed8; 
            --bg: #f3f4f6; 
            --card-bg: #ffffff; 
            --text: #1f2937; 
            --border: #e5e7eb; 
            --accent: #d97706; 
            --success: #10b981;
            --error: #ef4444;
        }
        
        body { overscroll-behavior-y: contain; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .container { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 20px; padding-bottom: 30px; }
        .section-container { width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .divider { text-align: center; color: #94a3b8; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin: -5px 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .divider::before, .divider::after { content: ""; height: 1px; background-color: var(--border); flex: 1; }
        
        .card { background-color: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); position: relative; }
        
        .card h2 { 
            margin-top: 0; 
            border-bottom: 2px solid var(--border); 
            padding-bottom: 10px; 
            margin-bottom: 20px; 
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 12px; 
        }
        
        .card-title-text { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        .chevron { font-size: 0.8rem; color: #94a3b8; transition: transform 0.3s ease; justify-self: end;}
        
        .pin-btn {
            grid-column: 1;
            background: transparent !important;
            border: none !important;
            color: #cbd5e1;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            margin: 0;
            margin-left: -6px; 
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
            -webkit-appearance: none;
        }

        @media (hover: hover) {
            .pin-btn:hover { background: #f1f5f9 !important; color: #94a3b8; }
        }
        
        .pin-btn svg { pointer-events: none; transition: fill 0.2s; }
        .card.pinned .pin-btn { color: var(--accent); }
        .card.pinned .pin-btn svg { fill: var(--accent); }
        
        .card.collapsed h2 { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .card.collapsed .card-body { display: none; }
        .card.collapsed .chevron { transform: rotate(-90deg); }

        .footer-version { text-align: center; color: #94a3b8; font-size: 0.75rem; margin-top: 20px; }

        /* --- Folder Tabs --- */
        .tabs-container { 
            display: flex; 
            border-bottom: 2px solid var(--border); 
            margin-bottom: 15px; 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none; 
            scroll-behavior: auto;
            align-items: flex-end; 
            padding-top: 15px; 
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tabs-list { 
            display: flex; 
            gap: 4px; 
            align-items: flex-end; 
            margin: 0; 
            padding: 0;
            margin-bottom: -2px; 
            position: relative;
        }
        
        .tab-btn { 
            margin: 0; 
            background: #f8fafc; 
            border: 1px solid var(--border); 
            border-bottom: none; 
            padding: 8px 16px; 
            border-radius: 8px 8px 0 0; 
            cursor: pointer; 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: #64748b; 
            white-space: nowrap; 
            -webkit-tap-highlight-color: transparent;
            height: 38px; 
            box-sizing: border-box;
            line-height: 1.2;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: pan-x pan-y; 
        }
        .tab-btn.active { 
            background: #ffffff; 
            color: var(--primary); 
            border-top: 3px solid var(--primary); 
            border-bottom: none; 
            height: 38px; 
            padding-top: 8px; 
            z-index: 2; 
        }
        
        .parent-tab-btn { 
            background: #e2e8f0; 
            color: #475569; 
            border: none; 
            border-radius: 20px; 
            padding: 8px 16px; 
            height: 35px; 
            margin-bottom: 2px;
        }
        .parent-tab-btn.active { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding-top: 8px; 
        }

        .add-tab-btn { 
            margin: 0; 
            background: transparent; 
            color: #94a3b8; 
            border: none; 
            font-size: 1.5rem; 
            cursor: pointer; 
            padding: 0 15px; 
            font-weight: bold; 
            transition: color 0.2s; 
            -webkit-tap-highlight-color: transparent; 
            height: 38px; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 4px; 
            user-select: none;
            -webkit-user-select: none;
        }
        .add-tab-btn:hover { color: var(--primary); }

        /* --- Inline Tab Options Menu --- */
        .tab-options-panel {
            display: none; 
            flex-direction: column; 
            background: #f8fafc; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            margin-bottom: 15px;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .row { display: flex; gap: 15px; } .row .input-group { flex: 1; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 0.875rem; }
        
        input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; font-family: inherit; width: 100%; max-width: 100%; min-height: 46px; box-sizing: border-box; transition: border-color 0.3s ease; margin: 0; display: block; -webkit-appearance: none; appearance: none; }
        input.input-error { border: 2px solid var(--error); background-color: #fff1f2; }
        
        input[type="checkbox"].tick-box {
            width: 24px !important;
            height: 24px !important;
            min-height: 24px !important;
            padding: 0 !important;
            margin: 0 12px 0 0 !important;
            -webkit-appearance: auto !important;
            appearance: auto !important;
            display: inline-block !important;
            cursor: pointer;
        }

        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; -webkit-tap-highlight-color: transparent; margin-bottom: 8px; }
        button:hover { background-color: var(--primary-hover); }
        button.secondary { background-color: var(--error); width: 100%; margin-top: 10px; }
        
        .btn-timer-start { background-color: #8b5cf6; }
        .btn-timer-start:hover { background-color: #7c3aed; }
        .timer-display { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 2rem; font-weight: bold; margin-top: 10px; text-align: center; border: 2px solid #334155; transition: all 0.3s; }
        .timer-active { border-color: var(--success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .timer-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        .result { margin-top: 15px; padding: 15px; background-color: #f8fafc; border-radius: 8px; border: 1px solid var(--border); font-size: 1.1rem; text-align: center; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 15px 0; text-align: center; }
        .stat-box { background-color: #f8fafc; border: 1px solid var(--border); padding: 10px; border-radius: 8px; }
        .stat-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; font-weight: bold; }
        .stat-value { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        
        .drag-container { display: none; flex-direction: column; gap: 8px; margin: 15px 0; max-height: 350px; overflow-y: auto; overflow-x: hidden; border-radius: 8px; padding: 4px; }
        .number-item { display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; gap: 10px; position: relative; z-index: 1; -webkit-tap-highlight-color: transparent; }
        .number-item.dragging { z-index: 100; opacity: 0.9; }
        .drag-handle { color: #94a3b8; font-size: 1.5rem; cursor: grab; padding: 10px; margin-left: -5px; display: flex; align-items: center; user-select: none; -webkit-user-select: none; touch-action: none; transition: color 0.2s; -webkit-tap-highlight-color: transparent; }
        .drag-handle:active { cursor: grabbing; color: var(--primary); }
        .edit-input { flex: 1; border: 1px solid transparent; background: transparent; font-weight: 600; font-size: 1.1rem; padding: 4px; text-align: center; transition: border-color 0.2s; }
        .edit-input:focus { border-bottom: 2px solid var(--primary); outline: none; border-radius: 0; }
        .remove-btn { background: #fee2e2; color: #ef4444; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; padding: 0; line-height: 1; transition: background-color 0.2s; }
        .remove-btn:hover { background: #fecaca; }
        .last-added-text { font-size: 0.85rem; color: var(--success); font-weight: 600; margin-top: 5px; min-height: 1.2em; transition: color 0.3s; display: flex; justify-content: flex-start; align-items: center; }
        .btn-recursive { background-color: var(--success); margin-top: 8px; font-size: 0.95rem; }
        
        @media (max-width: 480px) { .row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>

<div class="container" id="main-container">

    <div id="batch-header" style="width: 100%; text-align: center; margin-bottom: 5px; padding-top: 10px;">
        <div id="batchTitleDisplay" style="font-size: 0.75rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px;">Active Group / Batch</div>
        
        <div class="tabs-container" id="parentTabsContainer" style="border-bottom: none; padding: 0; margin: 0; justify-content: flex-start;">
            <div id="parentTabsList" class="tabs-list" style="margin: 0 auto; gap: 8px; padding-bottom: 10px;"></div>
        </div>
        <div id="parentTabOptionsPanel" class="tab-options-panel" style="margin-top: 10px; background: var(--card-bg); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: left;">
            <label style="margin-bottom: 5px; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Manage Group</label>
            <div style="display:flex; gap:10px; width:100%; margin-bottom: 10px;">
                <input type="text" id="renameParentTabInput" placeholder="Group Name" style="flex:1; min-height:40px; padding: 8px 12px; margin:0;">
                <button onclick="saveParentTabName()" style="width:auto; min-height:40px; margin:0; padding:0 20px;">Save</button>
            </div>
            <button onclick="confirmDeleteParentTab()" class="secondary" style="margin:0; min-height:40px;">Delete Entire Group</button>
        </div>
    </div>

    <div id="pinned-section" class="section-container" style="display: none;"></div>
    <div id="pinned-divider" class="divider" style="display: none;">Tools</div>
    <div id="unpinned-section" class="section-container">
    
        <div class="card collapsed" id="card-pickup">
            <h2 onclick="toggleCard('card-pickup')">
                <button class="pin-btn" onclick="togglePin(event, 'card-pickup')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Pickup Calculator</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">

                <div class="tabs-container" id="pickupTabsContainer">
                    <div id="pickupTabsList" class="tabs-list"></div>
                </div>

                <div id="pickupTabOptionsPanel" class="tab-options-panel">
                    <label style="margin-bottom: 5px; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Manage Sample</label>
                    <div style="display:flex; gap:10px; width:100%; margin-bottom: 10px;">
                        <input type="text" id="renamePickupTabInput" placeholder="Sample Name" style="flex:1; min-height:40px; padding: 8px 12px; margin:0;">
                        <button onclick="savePickupTabName()" style="width:auto; min-height:40px; margin:0; padding:0 20px;">Save</button>
                    </div>
                    <button onclick="confirmDeletePickupTab()" class="secondary" style="margin:0; min-height:40px;">Delete Sample</button>
                </div>

                <div class="stats-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 15px;">
                    <div class="stat-box"><div class="stat-label">Decimal</div><div class="stat-value" id="pickupDec">0.0000</div></div>
                    <div class="stat-box"><div class="stat-label">Percentage</div><div class="stat-value" id="pickupPct" style="color: var(--text);">0.00%</div></div>
                </div>

                <form onsubmit="event.preventDefault();">
                    <div class="row">
                        <div class="input-group">
                            <label>Pre-sample</label>
                            <input type="number" step="any" id="preSampleVal" inputmode="decimal" oninput="savePickupInputs()">
                        </div>
                        <div class="input-group">
                            <label>Post-sample</label>
                            <input type="number" step="any" id="postSampleVal" inputmode="decimal" oninput="savePickupInputs()">
                        </div>
                    </div>
                </form>
                
                <button id="clearPickupBtn" class="secondary" onclick="resetPickup()" style="display: none; margin-top: 5px;">Clear Current Sample</button>
            </div>
        </div>

        <div class="card collapsed" id="card-averaging">
            <h2 onclick="toggleCard('card-averaging')">
                <button class="pin-btn" onclick="togglePin(event, 'card-averaging')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Sum & Averaging</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                
                <div class="tabs-container" id="tabsContainer">
                    <div id="tabsList" class="tabs-list"></div>
                </div>

                <div id="tabOptionsPanel" class="tab-options-panel">
                    <label style="margin-bottom: 5px; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Manage Sample</label>
                    <div style="display:flex; gap:10px; width:100%; margin-bottom: 10px;">
                        <input type="text" id="renameTabInput" placeholder="Sample Name" style="flex:1; min-height:40px; padding: 8px 12px; margin:0;">
                        <button onclick="saveTabName()" style="width:auto; min-height:40px; margin:0; padding:0 20px;">Save</button>
                    </div>
                    <button onclick="confirmDeleteTab()" class="secondary" style="margin:0; min-height:40px;">Delete Sample</button>
                </div>

                <div class="stats-grid">
                    <div class="stat-box"><div class="stat-label">Count</div><div class="stat-value" id="statCount">0</div></div>
                    <div class="stat-box"><div class="stat-label">Sum</div><div class="stat-value" id="statSum">0</div></div>
                    <div class="stat-box"><div class="stat-label">Avg</div><div class="stat-value" id="statAvg">0</div></div>
                </div>
                <div class="input-group">
                    <label>Add Number</label>
                    <form onsubmit="event.preventDefault(); addNumber();" style="display: flex; gap: 10px; width: 100%; margin: 0;">
                        <input type="number" step="any" id="numberInput" inputmode="decimal" placeholder="0.00" style="flex: 1;">
                        <button type="submit" style="width: auto; margin-bottom: 0;">Add</button>
                    </form>
                    <div class="last-added-text" id="lastAddedDisplay"></div>
                </div>
                <div id="numberList" class="drag-container"></div>
                <button id="clearAllBtn" class="secondary" onclick="clearNumbers()" style="display:none;">Clear Current Sample</button>
            </div>
        </div>

        <div class="card collapsed" id="card-salinity">
            <h2 onclick="toggleCard('card-salinity')">
                <button class="pin-btn" onclick="togglePin(event, 'card-salinity')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Salinity Calculator</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                <div class="stats-grid" style="grid-template-columns: 1fr; margin-bottom: 15px;">
                    <div class="stat-box"><div class="stat-label">Salinity Percentage</div><div class="stat-value" id="salinityPct" style="color: var(--text);">0.00%</div></div>
                </div>

                <form onsubmit="event.preventDefault();">
                    <div class="input-group">
                        <label>Brix Value</label>
                        <input type="number" step="any" id="brixVal" inputmode="decimal" placeholder="Enter Brix" oninput="calculateSalinity()">
                    </div>
                </form>
                
                <button id="clearSalinityBtn" class="secondary" onclick="resetSalinity()" style="display: none; margin-top: 5px;">Clear</button>
            </div>
        </div>

        <div class="card collapsed" id="card-temp">
            <h2 onclick="toggleCard('card-temp')">
                <button class="pin-btn" onclick="togglePin(event, 'card-temp')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Temperature Converter</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                <form onsubmit="event.preventDefault();">
                    <div class="row">
                        <div class="input-group">
                            <label>Celsius (°C)</label>
                            <input type="number" step="any" id="celsiusVal" inputmode="decimal" placeholder="°C" oninput="convertTemp('C')">
                        </div>
                        <div class="input-group">
                            <label>Fahrenheit (°F)</label>
                            <input type="number" step="any" id="fahrenheitVal" inputmode="decimal" placeholder="°F" oninput="convertTemp('F')">
                        </div>
                    </div>
                </form>
                <button id="clearTempBtn" class="secondary" onclick="resetTemp()" style="display: none;">Clear</button>
            </div>
        </div>

        <div class="card collapsed" id="card-stopwatch">
            <h2 onclick="toggleCard('card-stopwatch')">
                <button class="pin-btn" onclick="togglePin(event, 'card-stopwatch')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Stopwatch</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                <div class="timer-display" id="stopwatchDisplay" style="margin-top: 0; margin-bottom: 15px;">00:00.00</div>
                <button id="holdTimerBtn" class="btn-timer-start" oncontextmenu="return false;" style="-webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; margin-bottom: 10px;">Hold to Time</button>
                <div style="display: flex; gap: 10px;">
                    <button id="toggleTimerBtn" onclick="toggleStopwatch()" style="margin: 0; flex: 1;">Start</button>
                    <button class="secondary" onclick="resetStopwatch()" style="margin: 0; flex: 1;">Reset</button>
                </div>
            </div>
        </div>

        <div class="card collapsed" id="card-sampling">
            <h2 onclick="toggleCard('card-sampling')">
                <button class="pin-btn" onclick="togglePin(event, 'card-sampling')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Sampling Time</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">
                <form onsubmit="event.preventDefault(); generateTime(false);">
                    <div class="row">
                        <div class="input-group">
                            <label>Min Mins</label>
                            <input type="number" id="minMinutes" placeholder="e.g. 40" inputmode="numeric">
                        </div>
                        <div class="input-group">
                            <label>Max Mins</label>
                            <input type="number" id="maxMinutes" placeholder="e.g. 60" inputmode="numeric">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Start Time</label>
                        <input type="time" id="startTime">
                    </div>
                    <button type="submit">Generate Time</button>
                </form>
                <div id="timeResult" class="result" style="display: none;"></div>
                <div id="timerControls" style="display: none; margin-top: 15px;">
                    <button class="btn-timer-start" onclick="handleStartTimer()">Start Countdown</button>
                </div>
                <div id="activeTimer" style="display: none; margin-top: 15px;">
                    <div class="timer-label">Time Remaining</div>
                    <div class="timer-display" id="countdown">00:00:00</div>
                    <button class="secondary" id="stopAlarmBtn" onclick="stopTimer()" style="display: none;">Stop Alarm</button>
                    <button class="secondary" id="cancelTimerBtn" onclick="stopTimer()">Cancel Timer</button>
                </div>
                <button id="clearTimeBtn" class="secondary" onclick="resetSamplingTime()" style="display: none;">Clear Time Data</button>
            </div>
        </div>
        
        <div class="card collapsed" id="card-estimator">
            <h2 onclick="toggleCard('card-estimator')">
                <button class="pin-btn" onclick="togglePin(event, 'card-estimator')" title="Pin Tool">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 11.7V6a3 3 0 0 0-6 0v5.7a2 2 0 0 1-1.11 1.84l-1.78.89A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <div class="card-title-text">Production Estimator</div>
                <div class="chevron">&#9660;</div>
            </h2>
            <div class="card-body">

                <div class="tabs-container" id="estimatorTabsContainer">
                    <div id="estimatorTabsList" class="tabs-list"></div>
                </div>

                <div id="estimatorTabOptionsPanel" class="tab-options-panel">
                    <label style="margin-bottom: 5px; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Manage Line</label>
                    <div style="display:flex; gap:10px; width:100%; margin-bottom: 10px;">
                        <input type="text" id="renameEstimatorTabInput" placeholder="Line Name" style="flex:1; min-height:40px; padding: 8px 12px; margin:0;">
                        <button onclick="saveEstimatorTabName()" style="width:auto; min-height:40px; margin:0; padding:0 20px;">Save</button>
                    </div>
                    <button onclick="confirmDeleteEstimatorTab()" class="secondary" style="margin:0; min-height:40px;">Delete Line</button>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label>What are we counting?</label>
                        <input type="text" id="estimatorUnitInput" placeholder="e.g. Pallets" oninput="updateEstimatorUnit()">
                    </div>
                    <div class="input-group">
                        <label>Shift Start Time</label>
                        <input type="time" id="estStartTimeInput" onchange="saveEstimatorStartTime()">
                    </div>
                </div>

                <form onsubmit="event.preventDefault(); addEstimatorEntry();">
                    <div class="row">
                        <div class="input-group">
                            <label>Amount (<span id="lblEstimatorUnit">Units</span>)</label>
                            <input type="number" id="estAmountInput" step="any" placeholder="Total Count" required>
                        </div>
                        <div class="input-group">
                            <label>Clock Time</label>
                            <input type="time" id="estTimeInput" required>
                        </div>
                    </div>
                    <button type="submit" style="margin-bottom: 0;">Add Log</button>
                </form>

                <div id="estimatorList" class="drag-container" style="gap:4px; max-height:280px; padding-top: 10px;"></div>

                <div class="result" id="estimatorPaceResult" style="display: none; margin-top: 15px;"></div>

                <div id="estimatorForecastBox" style="display:none; margin-top:15px; border-top:2px solid var(--border); padding-top:15px;">
                    <label style="font-weight:bold; color:var(--primary); margin-bottom:10px; display:block;">Forecast Finish Time</label>
                    <div class="input-group">
                        <input type="number" id="estRemainingInput" placeholder="Remaining Amount" step="any" oninput="calculateEstimatorPace()">
                    </div>
                    <div class="result" id="estimatorForecastResult" style="display: none; margin-top: 5px; background-color:#eff6ff; border-color:#bfdbfe;"></div>
                </div>
            </div>
        </div>    
    </div>
    <div class="footer-version">v56</div>
</div>

<audio id="alarmSound" loop preload="auto">
    <source src="alarm.ogg" type="audio/ogg">
</audio>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch((err) => console.error("SW Failed:", err));
        });
    }

    // --- GLOBALS FOR TAB STATE & GESTURES ---
    let preventTabClick = false; 
    let vibrationInterval = null;
    let startX = 0, startY = 0; 
    let isParentTabMenuOpen = false;
    let isPickupTabMenuOpen = false;
    let isTabMenuOpen = false;
    let isEstimatorTabMenuOpen = false;
    const alarm = document.getElementById('alarmSound');
    const allCardIds = ['card-pickup', 'card-averaging', 'card-salinity', 'card-temp', 'card-stopwatch', 'card-sampling', 'card-estimator'];
    
    // --- TIME FORMATTING HELPERS ---
    function format12Hour(hours, minutes) {
        const ampm = hours >= 12 ? 'PM' : 'AM';
        const h12 = hours % 12 || 12;
        return `${h12}:${String(minutes).padStart(2,'0')} ${ampm}`;
    }

    function formatTimeStringTo12Hour(timeStr) {
        if (!timeStr) return '';
        const [h, m] = timeStr.split(':').map(Number);
        return format12Hour(h, m);
    }

    function formatMinutesTo12Hour(totalMins) {
        let h = Math.floor(totalMins / 60) % 24;
        let m = Math.floor(totalMins % 60);
        return format12Hour(h, m);
    }

    function updateBatchTitle() {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 0);
        const diff = now - start;
        const oneDay = 1000 * 60 * 60 * 24;
        const julian = Math.floor(diff / oneDay).toString().padStart(3, '0');

        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const yyyy = now.getFullYear();

        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const dayName = days[now.getDay()];

        document.getElementById('batchTitleDisplay').innerText = `Day ${julian} • ${dd}/${mm}/${yyyy} • ${dayName}`;
    }
    
    function toggleCard(cardId) {
        const card = document.getElementById(cardId);
        card.classList.toggle('collapsed');
        const p = parentGroups.find(g => g.id === activeParentId);
        if (!p.collapsedCards) p.collapsedCards = {};
        p.collapsedCards[cardId] = card.classList.contains('collapsed');
        saveAllGroupData();
    }
    
    function togglePin(event, cardId) {
        event.stopPropagation(); 
        const p = parentGroups.find(g => g.id === activeParentId);
        if (!p.pinnedCards) p.pinnedCards = [];

        if (p.pinnedCards.includes(cardId)) {
            p.pinnedCards = p.pinnedCards.filter(id => id !== cardId);
            document.getElementById(cardId).classList.remove('pinned');
        } else {
            p.pinnedCards.push(cardId);
            document.getElementById(cardId).classList.add('pinned');
        }
        
        saveAllGroupData();
        reorderCards();
    }

    function applyCardStatesToDOM() {
        const p = parentGroups.find(g => g.id === activeParentId);
        const pinned = p.pinnedCards || [];
        const collapsed = p.collapsedCards || {};
        
        allCardIds.forEach(id => {
            const card = document.getElementById(id);
            if (pinned.includes(id)) card.classList.add('pinned');
            else card.classList.remove('pinned');
            
            // Explicitly default to collapsed if the value is not precisely 'false'
            if (collapsed[id] === false) {
                card.classList.remove('collapsed');
            } else {
                card.classList.add('collapsed');
            }
        });
        
        reorderCards();
    }
    
    function reorderCards() {
        const pinnedContainer = document.getElementById('pinned-section');
        const unpinnedContainer = document.getElementById('unpinned-section');
        const divider = document.getElementById('pinned-divider');
        let pinnedCount = 0;
        
        allCardIds.forEach(id => {
            const card = document.getElementById(id);
            if (card.classList.contains('pinned')) {
                pinnedContainer.appendChild(card);
                pinnedCount++;
            } else {
                unpinnedContainer.appendChild(card);
            }
        });
        
        if (pinnedCount > 0) {
            pinnedContainer.style.display = 'flex';
            divider.style.display = 'flex';
        } else {
            pinnedContainer.style.display = 'none';
            divider.style.display = 'none';
        }
    }
    
    function getNextTabName(tabsArray, prefix="Sample") {
        let maxNum = 0;
        const regex = new RegExp(`^${prefix}\\s+(\\d+)$`, 'i');
        tabsArray.forEach(t => {
            const match = t.name.trim().match(regex);
            if (match) {
                const num = parseInt(match[1]);
                if (num > maxNum) maxNum = num;
            }
        });
        return `${prefix} ${maxNum + 1}`;
    }

    // ==========================================
    // ---- DATA MIGRATION & PARENT GROUPS ------
    // ==========================================
    let parentGroups = JSON.parse(localStorage.getItem('qc_parent_groups'));
    let oldEstimator = JSON.parse(localStorage.getItem('qc_estimator_tabs_data')) || null;
    
    if (!parentGroups) {
        let oldPickup = JSON.parse(localStorage.getItem('qc_pickup_tabs_data')) || [{ id: 'ptab_'+Date.now(), name: 'Sample 1', pre: '', post: '' }];
        let oldSum = JSON.parse(localStorage.getItem('qc_tabs_data')) || [{ id: 'tab_'+Date.now(), name: 'Sample 1', data: [] }];
        parentGroups = [{
            id: 'pg_' + Date.now(),
            name: 'Group 1',
            pickupTabs: oldPickup,
            sumTabs: oldSum,
            pinnedCards: [],
            collapsedCards: {},
            estimatorTabs: oldEstimator || [{ id: 'etab_'+Date.now(), name: 'Line 1', unit: 'Pallets', startTime: '', remaining: '', data: [] }],
            salinity: { brix: '' },
            temp: { c: '', f: '' },
            stopwatch: { elapsed: 0, startTime: 0, isRunning: false, mode: null },
            sampling: { min: '', max: '', start: '', resultHtml: '', targetTime: null, lastGenStr: '', timerRunning: false, timeUp: false }
        }];
        localStorage.setItem('qc_parent_groups', JSON.stringify(parentGroups));
    }

    // Migration to ensure all groups have the new fields properly initialized
    parentGroups.forEach(g => {
        if (!g.pinnedCards) g.pinnedCards = [];
        if (!g.collapsedCards) g.collapsedCards = {};
        if (!g.estimatorTabs) g.estimatorTabs = [{ id: 'etab_' + Date.now() + Math.random(), name: 'Line 1', unit: 'Pallets', startTime: '', remaining: '', data: [] }];
        if (!g.salinity) g.salinity = { brix: '' };
        if (!g.temp) g.temp = { c: '', f: '' };
        if (!g.stopwatch) g.stopwatch = { elapsed: 0, startTime: 0, isRunning: false, mode: null };
        if (!g.sampling) g.sampling = { min: '', max: '', start: '', resultHtml: '', targetTime: null, lastGenStr: '', timerRunning: false, timeUp: false };
        g.sumTabs.forEach(t => { if(t.lastAddedStr === undefined) t.lastAddedStr = ''; });
    });

    let activeParentId = localStorage.getItem('qc_active_parent_id') || parentGroups[0].id;

    let pickupTabs, appTabs, estimatorTabs;
    let activePickupTabId, activeTabId, activeEstimatorTabId;

    function ensureActiveIds() {
        parentGroups.forEach(g => {
            if (!g.activePickupTabId || !g.pickupTabs.find(t => t.id === g.activePickupTabId)) {
                g.activePickupTabId = g.pickupTabs[0].id;
            }
            if (!g.activeTabId || !g.sumTabs.find(t => t.id === g.activeTabId)) {
                g.activeTabId = g.sumTabs[0].id;
            }
            if (!g.activeEstimatorTabId || !g.estimatorTabs.find(t => t.id === g.activeEstimatorTabId)) {
                g.activeEstimatorTabId = g.estimatorTabs[0].id;
            }
        });
    }

    function refreshGroupDataReferences() {
        const p = parentGroups.find(g => g.id === activeParentId);
        pickupTabs = p.pickupTabs;
        appTabs = p.sumTabs;
        estimatorTabs = p.estimatorTabs;
        activePickupTabId = p.activePickupTabId;
        activeTabId = p.activeTabId;
        activeEstimatorTabId = p.activeEstimatorTabId;
    }

    function saveAllGroupData() {
        const p = parentGroups.find(g => g.id === activeParentId);
        p.pickupTabs = pickupTabs;
        p.sumTabs = appTabs;
        p.estimatorTabs = estimatorTabs;
        p.activePickupTabId = activePickupTabId;
        p.activeTabId = activeTabId;
        p.activeEstimatorTabId = activeEstimatorTabId;
        localStorage.setItem('qc_parent_groups', JSON.stringify(parentGroups));
        localStorage.setItem('qc_active_parent_id', activeParentId);
    }

    function renderParentTabs() {
        const list = document.getElementById('parentTabsList');
        list.innerHTML = '';
        let activeBtnElement = null;

        parentGroups.forEach((tab) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn parent-tab-btn ${tab.id === activeParentId ? 'active' : ''}`;
            btn.innerText = tab.name;
            btn.dataset.id = tab.id; 
            
            if (tab.id === activeParentId) activeBtnElement = btn;

            btn.onclick = (e) => {
                const currentX = e.clientX || (e.changedTouches ? e.changedTouches[0].clientX : 0);
                const currentY = e.clientY || (e.changedTouches ? e.changedTouches[0].clientY : 0);
                const moved = Math.abs(currentX - startX) > 10 || Math.abs(currentY - startY) > 10;
                
                if (preventTabClick || moved) { e.preventDefault(); e.stopPropagation(); return; }

                if (activeParentId === tab.id) {
                    isParentTabMenuOpen = !isParentTabMenuOpen;
                    updateParentTabMenuState();
                } else {
                    activeParentId = tab.id;
                    isParentTabMenuOpen = false;
                    refreshGroupDataReferences();
                    
                    applyCardStatesToDOM(); 
                    
                    updateSalinityDOM();
                    updateTempDOM();
                    updateSamplingDOM();
                    updateStopwatchDOMToggle();
                    
                    renderParentTabs();
                    updateParentTabMenuState();
                    renderPickupTabs(); loadPickupInputs();
                    renderEstimatorTabs(); loadEstimatorInputs();
                    renderTabs(); renderList();
                }
            };
            list.appendChild(btn);
        });
        
        const addBtn = document.createElement('button');
        addBtn.className = 'add-tab-btn parent-tab-btn';
        addBtn.style.padding = '8px 16px';
        addBtn.innerText = '+';
        list.appendChild(addBtn);
        
        setTimeout(() => {
            if (activeBtnElement && !preventTabClick) {
                const container = list.parentElement;
                const scrollPos = activeBtnElement.offsetLeft - (container.clientWidth / 2) + (activeBtnElement.clientWidth / 2);
                container.scrollTo({ left: Math.max(0, scrollPos), behavior: 'smooth' });
            }
        }, 10);
    }

    function updateParentTabMenuState() {
        const panel = document.getElementById('parentTabOptionsPanel');
        if (isParentTabMenuOpen) {
            const p = parentGroups.find(t => t.id === activeParentId);
            document.getElementById('renameParentTabInput').value = p.name;
            panel.style.display = 'flex';
        } else {
            panel.style.display = 'none';
        }
    }

    function saveParentTabName() {
        const newName = document.getElementById('renameParentTabInput').value.trim();
        if (newName !== '') {
            const p = parentGroups.find(t => t.id === activeParentId);
            p.name = newName;
            saveAllGroupData();
            isParentTabMenuOpen = false;
            renderParentTabs();
            updateParentTabMenuState();
        }
    }

    function confirmDeleteParentTab() {
        const p = parentGroups.find(t => t.id === activeParentId);
        if (parentGroups.length === 1) {
            alert("You must have at least one active group.");
            return;
        }
        if (confirm(`Are you sure you want to delete the entire group "${p.name}"? This removes all data inside it.`)) {
            let currentIndex = parentGroups.findIndex(t => t.id === activeParentId);
            parentGroups = parentGroups.filter(t => t.id !== activeParentId);
            let newIndex = currentIndex - 1;
            if (newIndex < 0) newIndex = 0; 
            
            activeParentId = parentGroups[newIndex].id; 
            isParentTabMenuOpen = false;
            refreshGroupDataReferences();
            saveAllGroupData();
            
            applyCardStatesToDOM();
            
            updateSalinityDOM();
            updateTempDOM();
            updateSamplingDOM();
            updateStopwatchDOMToggle();
            
            renderParentTabs(); updateParentTabMenuState();
            renderPickupTabs(); loadPickupInputs();
            renderEstimatorTabs(); loadEstimatorInputs();
            renderTabs(); renderList();
        }
    }

    function addNewParentGroup() {
        const newName = getNextTabName(parentGroups, "Group");
        const newGroup = {
            id: 'pg_' + Date.now(),
            name: newName,
            pickupTabs: [{ id: 'ptab_'+Date.now(), name: 'Sample 1', pre: '', post: '' }],
            sumTabs: [{ id: 'tab_'+Date.now(), name: 'Sample 1', data: [], lastAddedStr: '' }],
            estimatorTabs: [{ id: 'etab_' + Date.now(), name: 'Line 1', unit: 'Pallets', startTime: '', remaining: '', data: [] }],
            pinnedCards: [],
            collapsedCards: {},
            salinity: { brix: '' },
            temp: { c: '', f: '' },
            stopwatch: { elapsed: 0, startTime: 0, isRunning: false, mode: null },
            sampling: { min: '', max: '', start: '', resultHtml: '', targetTime: null, lastGenStr: '', timerRunning: false, timeUp: false }
        };
        newGroup.activePickupTabId = newGroup.pickupTabs[0].id;
        newGroup.activeTabId = newGroup.sumTabs[0].id;
        newGroup.activeEstimatorTabId = newGroup.estimatorTabs[0].id;
        
        parentGroups.push(newGroup);
        activeParentId = newGroup.id;
        isParentTabMenuOpen = false;
        
        refreshGroupDataReferences();
        saveAllGroupData();
        applyCardStatesToDOM();
        
        updateSalinityDOM();
        updateTempDOM();
        updateSamplingDOM();
        updateStopwatchDOMToggle();
        
        renderParentTabs(); updateParentTabMenuState();
        renderPickupTabs(); loadPickupInputs();
        renderEstimatorTabs(); loadEstimatorInputs();
        renderTabs(); renderList();
    }


    document.addEventListener('DOMContentLoaded', () => {
        updateBatchTitle(); 
        ensureActiveIds();
        refreshGroupDataReferences();
        
        applyCardStatesToDOM(); 
        
        // Ensure menus start closed
        isParentTabMenuOpen = false;
        isPickupTabMenuOpen = false;
        isTabMenuOpen = false;
        isEstimatorTabMenuOpen = false;
        
        renderParentTabs(); updateParentTabMenuState();
        renderEstimatorTabs(); loadEstimatorInputs(); updateEstimatorTabMenuState();
        renderTabs(); renderList(); updateTabMenuState();
        renderPickupTabs(); loadPickupInputs(); updatePickupTabMenuState();
        
        updateSalinityDOM();
        updateTempDOM();
        updateSamplingDOM();
        updateStopwatchDOMToggle();
        
        startGlobalStopwatch(); 
        startGlobalSamplingTimer(); 

        setupTabDragManager('parentTabsContainer', 'parentTabsList', () => parentGroups, saveAllGroupData, renderParentTabs);
        setupTabDragManager('estimatorTabsContainer', 'estimatorTabsList', () => estimatorTabs, saveAllGroupData, renderEstimatorTabs);
        setupTabDragManager('pickupTabsContainer', 'pickupTabsList', () => pickupTabs, saveAllGroupData, renderPickupTabs);
        setupTabDragManager('tabsContainer', 'tabsList', () => appTabs, saveAllGroupData, renderTabs);
        
        setupAddButtonHold('parentTabsList', addNewParentGroup, () => {
            parentGroups = [{
                id: 'pg_' + Date.now(),
                name: 'Group 1',
                pickupTabs: [{ id: 'ptab_'+Date.now(), name: 'Sample 1', pre: '', post: '' }],
                sumTabs: [{ id: 'tab_'+Date.now(), name: 'Sample 1', data: [], lastAddedStr: '' }],
                estimatorTabs: [{ id: 'etab_' + Date.now(), name: 'Line 1', unit: 'Pallets', startTime: '', remaining: '', data: [] }],
                pinnedCards: [],
                collapsedCards: {},
                salinity: { brix: '' },
                temp: { c: '', f: '' },
                stopwatch: { elapsed: 0, startTime: 0, isRunning: false, mode: null },
                sampling: { min: '', max: '', start: '', resultHtml: '', targetTime: null, lastGenStr: '', timerRunning: false, timeUp: false }
            }];
            parentGroups[0].activePickupTabId = parentGroups[0].pickupTabs[0].id;
            parentGroups[0].activeTabId = parentGroups[0].sumTabs[0].id;
            parentGroups[0].activeEstimatorTabId = parentGroups[0].estimatorTabs[0].id;
            
            activeParentId = parentGroups[0].id;
            isParentTabMenuOpen = false;
            refreshGroupDataReferences();
            saveAllGroupData();
            applyCardStatesToDOM();
            updateSalinityDOM(); updateTempDOM(); updateSamplingDOM(); updateStopwatchDOMToggle();
            renderParentTabs(); updateParentTabMenuState();
            renderPickupTabs(); loadPickupInputs();
            renderEstimatorTabs(); loadEstimatorInputs();
            renderTabs(); renderList();
        }, "Delete ALL groups and start completely fresh?");

        setupAddButtonHold('estimatorTabsList', addNewEstimatorTab, () => {
            estimatorTabs.splice(0, estimatorTabs.length, { id: 'etab_' + Date.now(), name: 'Line 1', unit: 'Pallets', startTime: '', remaining: '', data: [] });
            activeEstimatorTabId = estimatorTabs[0].id;
            isEstimatorTabMenuOpen = false;
            saveAllGroupData();
            renderEstimatorTabs();
            loadEstimatorInputs();
            updateEstimatorTabMenuState();
        }, "Delete ALL records from the Production Estimator? This cannot be undone.");

        setupAddButtonHold('pickupTabsList', addNewPickupTab, () => {
            pickupTabs.splice(0, pickupTabs.length, { id: 'ptab_' + Date.now(), name: 'Sample 1', pre: '', post: '' });
            activePickupTabId = pickupTabs[0].id;
            isPickupTabMenuOpen = false; 
            saveAllGroupData();
            renderPickupTabs();
            loadPickupInputs();
            updatePickupTabMenuState(); 
        }, "Delete ALL samples from the Pickup Calculator? This cannot be undone.");
        
        setupAddButtonHold('tabsList', addNewTab, () => {
            appTabs.splice(0, appTabs.length, { id: 'tab_' + Date.now(), name: 'Sample 1', data: [], lastAddedStr: '' });
            activeTabId = appTabs[0].id;
            isTabMenuOpen = false; 
            saveAllGroupData();
            renderTabs();
            renderList();
            updateTabMenuState(); 
        }, "Delete ALL samples from Sum & Averaging? This cannot be undone.");

        // Force UI Repaint for Manage Tabs fix 
        setTimeout(() => {
            ['tabsList', 'estimatorTabsList', 'pickupTabsList'].forEach(id => {
                const list = document.getElementById(id);
                if (list) { list.style.display = 'none'; list.offsetHeight; list.style.display = 'flex'; }
            });
        }, 100);
    });

    // ==========================================
    // ---- SMOOTH TAB DRAG ENGINE --------------
    // ==========================================
    function setupTabDragManager(containerId, listId, getArrayFn, saveFn, renderFn) {
        const list = document.getElementById(listId);
        const container = document.getElementById(containerId);
        
        let holdTimer = null;
        let isDragging = false;
        let dragIdx = -1;
        let itemWidth = 0;
        let elements = [];
        let startScrollLeft = 0;
        
        let scrollDirection = 0;
        let autoScrollInterval = null;
        let lastClientX = 0;

        const startDrag = (e) => {
            const btn = e.target.closest('.tab-btn');
            if (!btn || btn.classList.contains('add-tab-btn')) return;
            if (e.type === 'mousedown' && e.button !== 0) return;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // Updating Global Variables for clicks
            startX = clientX;
            startY = clientY;
            startScrollLeft = container.scrollLeft;

            const arr = getArrayFn();
            dragIdx = arr.findIndex(t => t.id === btn.dataset.id);

            holdTimer = setTimeout(() => {
                isDragging = true;
                if ('vibrate' in navigator) { try { navigator.vibrate(50); } catch(err){} }

                elements = Array.from(list.querySelectorAll('.tab-btn:not(.add-tab-btn)'));
                const gap = parseInt(window.getComputedStyle(list).gap) || 4;
                itemWidth = elements[0].offsetWidth + gap;

                btn.style.transition = 'none';
                btn.style.zIndex = '100';
                btn.style.transform = 'scale(1.05)';
                btn.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)'; 
                
                if (btn.classList.contains('parent-tab-btn') && btn.classList.contains('active')) {
                    btn.style.backgroundColor = 'var(--primary-hover)';
                    btn.style.color = 'white';
                } else {
                    btn.style.backgroundColor = '#f1f5f9';
                }

                elements.forEach(el => {
                    if (el !== btn) el.style.transition = 'transform 0.2s ease';
                    el.dataset.offset = 0;
                });
            }, 400);
        };

        const executeVisualMove = (clientX) => {
            const deltaX = clientX - startX;
            const scrollShift = container.scrollLeft - startScrollLeft;
            const totalMove = deltaX + scrollShift;

            elements[dragIdx].style.transform = `translateX(${totalMove}px) scale(1.05)`;

            let moveSteps = Math.round(totalMove / itemWidth);
            let targetIdx = Math.max(0, Math.min(elements.length - 1, dragIdx + moveSteps));

            elements.forEach((el, idx) => {
                if (idx === dragIdx) return;
                let offset = 0;
                if (idx > dragIdx && idx <= targetIdx) offset = -itemWidth;
                else if (idx < dragIdx && idx >= targetIdx) offset = itemWidth;
                
                if (el.dataset.offset != offset) {
                    el.style.transform = `translateX(${offset}px)`;
                    el.dataset.offset = offset;
                }
            });
        }

        const moveDrag = (e) => {
            lastClientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            if (!isDragging && holdTimer) {
                if (Math.abs(lastClientX - startX) > 10 || Math.abs(clientY - startY) > 10) {
                    clearTimeout(holdTimer);
                    holdTimer = null;
                }
                return;
            }

            if (isDragging) {
                e.preventDefault(); 
                executeVisualMove(lastClientX);

                const rect = container.getBoundingClientRect();
                
                if (lastClientX < rect.left + 50) {
                    scrollDirection = -10;
                } else if (lastClientX > rect.right - 50) {
                    scrollDirection = 10;
                } else {
                    scrollDirection = 0;
                }

                if (scrollDirection !== 0 && !autoScrollInterval) {
                    autoScrollInterval = setInterval(() => {
                        container.scrollLeft += scrollDirection;
                        executeVisualMove(lastClientX);
                    }, 16); 
                } else if (scrollDirection === 0 && autoScrollInterval) {
                    clearInterval(autoScrollInterval);
                    autoScrollInterval = null;
                }
            }
        };

        const endDrag = (e) => {
            clearTimeout(holdTimer);
            holdTimer = null;
            
            if (autoScrollInterval) {
                clearInterval(autoScrollInterval);
                autoScrollInterval = null;
            }
            scrollDirection = 0;

            if (isDragging) {
                isDragging = false;
                preventTabClick = true;
                setTimeout(() => preventTabClick = false, 150);

                const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                const deltaX = clientX - startX;
                const scrollShift = container.scrollLeft - startScrollLeft;
                const totalMove = deltaX + scrollShift;

                let moveSteps = Math.round(totalMove / itemWidth);
                let targetIdx = Math.max(0, Math.min(elements.length - 1, dragIdx + moveSteps));

                if (dragIdx !== targetIdx) {
                    const arr = getArrayFn();
                    const item = arr.splice(dragIdx, 1)[0];
                    arr.splice(targetIdx, 0, item);
                    saveFn();
                }
                renderFn();
            }
        };

        list.addEventListener('touchstart', startDrag, { passive: true });
        list.addEventListener('mousedown', startDrag);
        
        document.addEventListener('touchmove', moveDrag, { passive: false });
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('touchend', endDrag);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchcancel', endDrag);
    }

    function setupAddButtonHold(listId, addAction, resetAction, promptMessage) {
        const list = document.getElementById(listId);
        let holdTimer = null;
        let isHold = false;
        let holdStartX = 0, holdStartY = 0;

        const startHold = (e) => {
            const btn = e.target.closest('.add-tab-btn');
            if (!btn || (e.type === 'mousedown' && e.button !== 0)) return;
            
            isHold = false;
            holdStartX = e.touches ? e.touches[0].clientX : e.clientX; 
            holdStartY = e.touches ? e.touches[0].clientY : e.clientY;

            holdTimer = setTimeout(() => {
                isHold = true;
                if (navigator.vibrate) navigator.vibrate(50);
                if (confirm(promptMessage)) resetAction();
            }, 800);
        };

        const cancelHold = (e) => {
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
                const btn = e.target.closest('.add-tab-btn');
                if (btn && !isHold) {
                    preventTabClick = true;
                    setTimeout(() => preventTabClick = false, 150);
                    addAction(); 
                }
            }
        };

        list.addEventListener('touchstart', startHold, { passive: true });
        list.addEventListener('mousedown', startHold);
        list.addEventListener('touchmove', (e) => {
            if (holdTimer && (Math.abs(e.touches[0].clientX - holdStartX) > 10 || Math.abs(e.touches[0].clientY - holdStartY) > 10)) {
                clearTimeout(holdTimer); holdTimer = null;
            }
        }, { passive: true });
        
        list.addEventListener('touchend', cancelHold);
        list.addEventListener('mouseup', cancelHold);
        list.addEventListener('touchcancel', () => clearTimeout(holdTimer));
    }

    function parseTimeToMinutes(timeStr) {
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m;
    }

    function formatMinutesToTime(totalMins) {
        let h = Math.floor(totalMins / 60) % 24;
        let m = Math.floor(totalMins % 60);
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    }

                    </div>

            `;
            
            container.appendChild(div);
        });

    }

    function calculateEstimatorPace() {
        const tab = getActiveEstimator();
        const checked = tab.data.filter(e => e.checked).sort((a,b) => parseTimeToMinutes(a.time) - parseTimeToMinutes(b.time));
        const paceRes = document.getElementById('estimatorPaceResult');
        const forecastBox = document.getElementById('estimatorForecastBox');
        const forecastRes = document.getElementById('estimatorForecastResult');
        
        const remInput = document.getElementById('estRemainingInput').value;
        tab.remaining = remInput;
        saveAllGroupData();

        if (checked.length === 0) {
            paceRes.style.display = 'none';
            forecastBox.style.display = 'none';
            return;
        }

        if (checked.length < 2 && !tab.startTime) {
            paceRes.style.display = 'block';
            paceRes.innerHTML = `<span style="font-size:0.85rem; color:#64748b;">Requires a Start Time or 2 checked logs.</span>`;
            forecastBox.style.display = 'none';
            return;
        }

        const firstTimeMins = tab.startTime ? parseTimeToMinutes(tab.startTime) : parseTimeToMinutes(checked[0].time);
        const lastEntry = checked[checked.length - 1];
        const lastTimeMins = parseTimeToMinutes(lastEntry.time);
        
        let timeDiffMins = lastTimeMins - firstTimeMins;
        if (timeDiffMins < 0) timeDiffMins += 24 * 60; // Midnight rollover
        
        if (timeDiffMins === 0) timeDiffMins = 1;
        
        let totalHours = timeDiffMins / 60; 
        
        const totalAmount = checked.reduce((sum, e) => sum + parseFloat(e.amount), 0);
        const pacePerHour = totalAmount / totalHours;

        const displayUnit = tab.unit || 'Units';

        paceRes.style.display = 'block';
        paceRes.innerHTML = `Avg Pace: <strong style="font-size:1.15rem; color:var(--primary);">${pacePerHour.toFixed(2)} <span style="font-size:0.8rem; color:#64748b;">${displayUnit}/hr</span></strong>`;
        
        forecastBox.style.display = 'block';
        
        const remaining = parseFloat(remInput);
        if (!isNaN(remaining) && remaining > 0 && pacePerHour > 0) {
            const hoursNeeded = remaining / pacePerHour;
            const finishTimeMins = lastTimeMins + (hoursNeeded * 60);
            
            const time24 = formatMinutesToTime(finishTimeMins);
            const time12 = formatMinutesTo12Hour(finishTimeMins);
            
            forecastRes.style.display = 'block';
            forecastRes.innerHTML = `Projected Finish: <strong style="font-size:1.3rem; color:var(--primary); margin-left:5px;">${time24}</strong> <span style="font-size:1rem; color:var(--accent); font-weight:bold; margin-left:5px;">(${time12})</span>`;
        } else {
            forecastRes.style.display = 'none';
        }
    }

    function startGlobalStopwatch() {
        setInterval(() => {
            const p = parentGroups.find(g => g.id === activeParentId);
            if (!p || !p.stopwatch) return;
            
            let diff = p.stopwatch.elapsed;
            if (p.stopwatch.isRunning) { 
                diff += (Date.now() - p.stopwatch.startTime); 
            }
            
            if (diff > 0 || p.stopwatch.isRunning) {
                const m = Math.floor(diff / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                const ms = Math.floor((diff % 1000) / 10);
                document.getElementById('stopwatchDisplay').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
            } else {

            }
        }, 10);
    }

    function generateTime(isRecursive) {
        const p = parentGroups.find(g => g.id === activeParentId);
        const minInput = document.getElementById('minMinutes');
        const maxInput = document.getElementById('maxMinutes');
        const startTimeInput = document.getElementById('startTime');

        [minInput, maxInput, startTimeInput].forEach(el => el.classList.remove('input-error'));

        if (!isRecursive) {
            if (!startTimeInput.value) {
                startTimeInput.classList.add('input-error');
                setTimeout(() => { startTimeInput.classList.remove('input-error'); }, 3000);
                return;
            }
        }

        const min = parseInt(minInput.value) || 0; 
        const max = parseInt(maxInput.value) || 0;
        let startStr = isRecursive ? p.sampling.lastGenStr : startTimeInput.value;
        
        p.sampling.min = minInput.value;
        p.sampling.max = maxInput.value;
        p.sampling.start = startTimeInput.value;
        
        const effectiveMax = Math.max(min, max);
        const rand = Math.floor(Math.random() * (effectiveMax - min + 1)) + min;
        const [h, m] = startStr.split(':').map(Number);
        
        let target = new Date();
        target.setHours(h, m + rand, 0, 0);
        if (target < new Date()) { target.setDate(target.getDate() + 1); }

        p.sampling.targetTime = target.getTime();
        p.sampling.lastGenStr = `${String(target.getHours()).padStart(2,'0')}:${String(target.getMinutes()).padStart(2,'0')}`;
        
        const ref12 = format12Hour(h, m);
        const target12 = format12Hour(target.getHours(), target.getMinutes());
        
        p.sampling.resultHtml = `
            <div style="font-size:0.85rem;color:#64748b; margin-bottom:5px;">Reference: ${startStr} <span style="font-weight:bold; color:#475569;">(${ref12})</span> <span style="font-size:0.75rem;">(+${rand}m)</span></div>
            <div style="font-weight:bold;color:var(--primary);font-size:1.4rem; margin-bottom:10px;">Target: ${p.sampling.lastGenStr} <span style="font-size:1.1rem; color:var(--accent);">(${target12})</span></div>
            <button class="btn-recursive" onclick="generateTime(true)" style="margin:0;">Next window from ${p.sampling.lastGenStr}</button>
        `;
        
        saveAllGroupData();
        updateSamplingDOM();
    }

    function startGlobalSamplingTimer() {
        setInterval(() => {
            const now = Date.now();
            
            parentGroups.forEach(g => {
                if (g.sampling && g.sampling.timerRunning && g.sampling.targetTime) {
                    if (g.sampling.targetTime - now < 0 && !g.sampling.timeUp) {
                        g.sampling.timerRunning = false;
                        g.sampling.timeUp = true;
                        saveAllGroupData();
                        triggerFinalAlarm(g.name);
                    }
                }
            });

            const p = parentGroups.find(g => g.id === activeParentId);
            if (!p || !p.sampling) return;
            
            const display = document.getElementById('countdown');
            if (p.sampling.timerRunning && p.sampling.targetTime) {
                const distance = p.sampling.targetTime - now;
                if (distance >= 0) {
                    const h = Math.floor((distance % 86400000) / 3600000);
                    const m = Math.floor((distance % 3600000) / 60000);
                    const s = Math.floor((distance % 60000) / 1000);
                    display.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                }
            }
        }, 1000);
    }

    async function triggerFinalAlarm(groupName) {
        alarm.play().catch(e => console.log("Audio block."));
        
        if ("vibrate" in navigator) {

            vibrationInterval = setInterval(() => {

            }, 2000);
        }

        if (Notification.permission === "granted") {
            try {
                const reg = await navigator.serviceWorker.ready;
                await reg.showNotification(`QC ALERT: ${groupName} SAMPLES!`, { 
                    body: "Tap to stop the alarm.", 
                    requireInteraction: true,
                    vibrate: [500, 200, 500, 200, 500],
                    icon: "https://cdn-icons-png.flaticon.com/512/1162/1162456.png",
                    tag: 'qc-alert'

    // --- List Drag & Auto-Scroll Specific Vars ---
    let listDraggingIdx = null;
    let listStartY = 0;
    let listStartScrollTop = 0;
    let listRowHeight = 0;
    let listElements = [];
    let listScrollInterval = null;
    let listScrollDir = 0;
    let listLastClientY = 0;

    function executeListVisualMove() {
        if (listDraggingIdx === null) return;
        const container = document.getElementById('numberList');
        const totalMove = (listLastClientY - listStartY) + (container.scrollTop - listStartScrollTop);
        const draggedEl = listElements[listDraggingIdx];
        draggedEl.style.transform = `translateY(${totalMove}px)`;

        let moveSteps = Math.round(totalMove / listRowHeight);
        let targetIdx = listDraggingIdx + moveSteps;
        targetIdx = Math.max(0, Math.min(listElements.length - 1, targetIdx));

        listElements.forEach((el, idx) => {
            if (idx === listDraggingIdx) return;
            let offset = 0;
            if (idx > listDraggingIdx && idx <= targetIdx) offset = -listRowHeight;
            else if (idx < listDraggingIdx && idx >= targetIdx) offset = listRowHeight;
            
            if (el.dataset.offset != offset) {
                el.style.transform = `translateY(${offset}px)`;
                el.dataset.offset = offset;
            }
        });
    }

    function onListPointerMove(e) {
        if (listDraggingIdx === null) return;
        listLastClientY = e.clientY || (e.touches ? e.touches[0].clientY : listLastClientY);
        executeListVisualMove();

        const container = document.getElementById('numberList');
        const rect = container.getBoundingClientRect();
        
        if (listLastClientY < rect.top + 40) {
            listScrollDir = -5;
        } else if (listLastClientY > rect.bottom - 40) {
            listScrollDir = 5;
        } else {
            listScrollDir = 0;
        }

        if (listScrollDir !== 0 && !listScrollInterval) {
            listScrollInterval = setInterval(() => {
                container.scrollTop += listScrollDir;
                executeListVisualMove();
            }, 16);
        } else if (listScrollDir === 0 && listScrollInterval) {
            clearInterval(listScrollInterval);
            listScrollInterval = null;
        }
    }

    function onListPointerUp(e) {
        if (listDraggingIdx === null) return;
        
        if (listScrollInterval) {
            clearInterval(listScrollInterval);
            listScrollInterval = null;
        }
        
        const container = document.getElementById('numberList');
        const totalMove = (listLastClientY - listStartY) + (container.scrollTop - listStartScrollTop);
        let moveSteps = Math.round(totalMove / listRowHeight);
        let targetIdx = listDraggingIdx + moveSteps;
        targetIdx = Math.max(0, Math.min(listElements.length - 1, targetIdx));

        if (listDraggingIdx !== targetIdx) {
            const arr = getActiveData();
            const item = arr.splice(listDraggingIdx, 1)[0];
            arr.splice(targetIdx, 0, item);
            saveAllGroupData();
        }

        listDraggingIdx = null;
        document.removeEventListener('pointermove', onListPointerMove);
        document.removeEventListener('pointerup', onListPointerUp);
        document.removeEventListener('pointercancel', onListPointerUp);
        document.removeEventListener('touchmove', onListPointerMove);
        document.removeEventListener('touchend', onListPointerUp);
        document.removeEventListener('touchcancel', onListPointerUp);
        renderList();
    }

    function renderList() {
        const container = document.getElementById('numberList');
        const clearBtn = document.getElementById('clearAllBtn');
        const arr = getActiveData();
        const activeTab = appTabs.find(t => t.id === activeTabId);
        
        container.innerHTML = '';
        container.style.display = arr.length ? "flex" : "none";
        clearBtn.style.display = arr.length ? "block" : "none";
        
        const display = document.getElementById('lastAddedDisplay');
        display.innerHTML = activeTab.lastAddedStr || '';
        display.style.color = activeTab.lastAddedColor || 'var(--success)';
        
        if (activeTab) {
            clearBtn.innerText = `Clear ${activeTab.name}`;
        }
        
        arr.forEach((n, i) => {
            const div = document.createElement('div');
            div.className = 'number-item';
            div.innerHTML = `
                <div class="drag-handle" title="Hold to reorder">&#x2261;</div>
                <input type="number" class="edit-input" value="${n}" onchange="updateNumber(${i}, this); this.blur();" inputmode="decimal">
                <button class="remove-btn" onclick="removeNumber(${i})" title="Remove">&times;</button>
            `;

            const handle = div.querySelector('.drag-handle');
            const inputField = div.querySelector('.edit-input');

            handle.addEventListener('pointerdown', (e) => {
                document.activeElement.blur(); 
                
                listStartY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
                listLastClientY = listStartY;
                
                let holdTimer = setTimeout(() => {
                    if (navigator.vibrate) navigator.vibrate(50);
                    
                    listDraggingIdx = i;
                    listStartScrollTop = container.scrollTop;
                    listElements = Array.from(container.children);
                    
                    const gap = parseInt(window.getComputedStyle(container).gap) || 8;
                    listRowHeight = listElements[0].offsetHeight + gap;
                    
                    listElements.forEach((el) => {
                        el.style.transition = 'transform 0.2s cubic-bezier(0.2, 0, 0, 1)';
                        el.dataset.offset = 0;
                    });
                    
                    div.style.transition = 'none'; 
                    div.classList.add('dragging');
                    inputField.style.pointerEvents = 'none'; 
                    
                    document.addEventListener('pointermove', onListPointerMove, { passive: false });
                    document.addEventListener('pointerup', onListPointerUp);
                    document.addEventListener('pointercancel', onListPointerUp);
                    
                    // Add touch explicit events for mobile resilience
                    document.addEventListener('touchmove', onListPointerMove, { passive: false });
                    document.addEventListener('touchend', onListPointerUp);
                    document.addEventListener('touchcancel', onListPointerUp);
                }, 400); 

                const cancelHold = (eMove) => {
                    const moveY = eMove.clientY || (eMove.touches ? eMove.touches[0].clientY : 0);
                    if ((eMove.type === 'pointermove' || eMove.type === 'touchmove') && Math.abs(moveY - listStartY) < 10) return;
                    
                    clearTimeout(holdTimer);
                    document.removeEventListener('pointermove', cancelHold);
                    document.removeEventListener('pointerup', cancelHold);
                    document.removeEventListener('pointercancel', cancelHold);
                    document.removeEventListener('touchmove', cancelHold);
                    document.removeEventListener('touchend', cancelHold);
                    document.removeEventListener('touchcancel', cancelHold);
                };

                document.addEventListener('pointermove', cancelHold);
                document.addEventListener('pointerup', cancelHold);
                document.addEventListener('pointercancel', cancelHold);
                document.addEventListener('touchmove', cancelHold);
                document.addEventListener('touchend', cancelHold);
                document.addEventListener('touchcancel', cancelHold);
            });

            container.appendChild(div);
        });
        updateStats();
    }

        const brixStr = p.salinity.brix;

        const brixInput = document.getElementById('brixVal');

        if (isNaN(brix) || brixStr === '') {
            pctEl.innerText = "0.00%";
            pctEl.style.color = "var(--text)";
            clearBtn.style.display = "none";
            return;
        }
        
        const salinity = (brix / 26.4) * 100;
        pctEl.innerText = salinity.toFixed(2) + "%";
        pctEl.style.color = "var(--accent)";
        clearBtn.style.display = 'block';
    }

    function resetSalinity() {
        const p = parentGroups.find(g => g.id === activeParentId);
        p.salinity.brix = '';
        saveAllGroupData();
        updateSalinityDOM();
    }
</script>
</body>
</html>
