<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QC Toolset Pro</title>
    
    <style>
        :root { --primary: #2563eb; --primary-hover: #1d4ed8; --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; --border: #e5e7eb; --accent: #d97706; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 20px; padding-bottom: 50px; }
        .card { background-color: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 1.25rem; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .row { display: flex; gap: 15px; } .row .input-group { flex: 1; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 0.875rem; }
        input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; width: 100%; box-sizing: border-box; }
        
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; }
        button.secondary { background-color: #ef4444; margin-top: 10px; }
        
        .result { margin-top: 15px; padding: 15px; background-color: #f8fafc; border-radius: 8px; border: 1px solid var(--border); font-size: 1.1rem; text-align: center; }
        .glaze-pct { color: var(--accent); font-weight: 800; font-size: 1.3rem; }
        
        /* Drag and Drop UX */
        .drag-container { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; max-height: 400px; overflow-y: auto; border-radius: 8px; }
        .number-item { display: flex; align-items: center; background: #fff; border: 1px solid var(--border); padding: 10px; border-radius: 8px; gap: 10px; transition: transform 0.1s, box-shadow 0.1s; position: relative; z-index: 1; }
        .dragging { opacity: 0.5; background: #eff6ff; border: 2px dashed var(--primary); transform: scale(0.98); z-index: 0; }
        .drag-handle { color: #94a3b8; font-size: 1.5rem; cursor: grab; padding: 5px 15px; user-select: none; -webkit-user-select: none; touch-action: none; }
        .edit-input { flex: 1; border: none; font-weight: 600; font-size: 1.1rem; background: transparent; }
        .remove-btn { background: #fee2e2; color: #ef4444; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; text-align: center; }
        .stat-box { background-color: #f8fafc; border: 1px solid var(--border); padding: 10px; border-radius: 8px; }
        .stat-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; font-weight: bold; }
        .stat-value { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        .last-added-text { font-size: 0.85rem; color: #10b981; font-weight: 600; margin-top: 5px; height: 1.2em; }
        
        @media (max-width: 480px) { .row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Glaze Calculator</h2>
        <div class="row">
            <div class="input-group"><label>Glazed</label><input type="number" step="any" id="glazedVal" inputmode="decimal"></div>
            <div class="input-group"><label>Deglazed</label><input type="number" step="any" id="deglazeVal" inputmode="decimal"></div>
        </div>
        <button onclick="calculateGlaze()">Calculate Glaze</button>
        <div class="result" id="glazeResult" style="display: none;"></div>
    </div>

    <div class="card">
        <h2>Averaging & Sum</h2>
        <div class="stats-grid">
            <div class="stat-box"><div class="stat-label">Count</div><div class="stat-value" id="statCount">0</div></div>
            <div class="stat-box"><div class="stat-label">Sum</div><div class="stat-value" id="statSum">0</div></div>
            <div class="stat-box"><div class="stat-label">Avg</div><div class="stat-value" id="statAvg">0</div></div>
        </div>
        <div class="input-group">
            <label>Add Number</label>
            <div style="display: flex; gap: 10px;">
                <input type="number" step="any" id="numberInput" inputmode="decimal" placeholder="0.00" onkeypress="if(event.key==='Enter')addNumber()">
                <button onclick="addNumber()" style="width: auto;">Add</button>
            </div>
            <div class="last-added-text" id="lastAddedDisplay"></div>
        </div>
        <div id="numberList" class="drag-container"></div>
        <button class="secondary" id="clearBtn" style="display:none;" onclick="clearNumbers()">Clear All</button>
    </div>
</div>

<script>
    function calculateGlaze() {
        const g=parseFloat(document.getElementById('glazedVal').value);
        const d=parseFloat(document.getElementById('deglazeVal').value);
        const res=document.getElementById('glazeResult');
        if(!g||!d) return;
        const dec=(g-d)/g;
        res.style.display="block";
        res.innerHTML=`Decimal: <strong>${dec.toFixed(4)}</strong> | <span class="glaze-pct">${(dec * 100).toFixed(2)}%</span>`;
    }

    let numbers = [];
    function addNumber() {
        const inp = document.getElementById('numberInput');
        const val = parseFloat(inp.value); if (isNaN(val)) return;
        document.getElementById('lastAddedDisplay').innerText = `Last added: ${val}`;
        numbers.push(val);
        inp.value = ''; 
        renderList();
        
        const container = document.getElementById('numberList');
        container.scrollTop = container.scrollHeight;
        
        clearTimeout(window.lastAddedTimeout);
        window.lastAddedTimeout = setTimeout(() => { document.getElementById('lastAddedDisplay').innerText = ''; }, 2500);
    }
    
    function removeNumber(i) { numbers.splice(i, 1); renderList(); }
    function clearNumbers() { numbers = []; renderList(); }
    function updateVal(i, v) { numbers[i] = parseFloat(v) || 0; updateStats(); }

    function renderList() {
        const container = document.getElementById('numberList');
        const clearBtn = document.getElementById('clearBtn');
        container.innerHTML = '';
        
        // Hide list and clear button if empty
        if (numbers.length === 0) {
            container.style.display = "none";
            clearBtn.style.display = "none";
        } else {
            container.style.display = "flex";
            clearBtn.style.display = "block";
        }

        numbers.forEach((n, i) => {
            const div = document.createElement('div');
            div.className = 'number-item';
            div.draggable = true;
            div.innerHTML = `
                <span class="drag-handle">☰</span>
                <input type="number" class="edit-input" value="${n}" onchange="updateVal(${i}, this.value)" inputmode="decimal">
                <button class="remove-btn" onclick="removeNumber(${i})">&times;</button>
            `;
            
            // Modern Drag Events
            div.addEventListener('dragstart', () => div.classList.add('dragging'));
            div.addEventListener('dragend', () => {
                div.classList.remove('dragging');
                saveNewOrder();
            });
            
            container.appendChild(div);
        });

        container.addEventListener('dragover', e => {
            e.preventDefault();
            const dragging = document.querySelector('.dragging');
            if (!dragging) return;
            const afterElement = getDragAfterElement(container, e.clientY);
            if (afterElement == null) {
                container.appendChild(dragging);
            } else {
                container.insertBefore(dragging, afterElement);
            }
        });
        
        updateStats();
    }

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.number-item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function saveNewOrder() {
        const container = document.getElementById('numberList');
        numbers = [...container.querySelectorAll('.edit-input')].map(input => parseFloat(input.value) || 0);
        updateStats();
    }

    function updateStats() {
        const sum = numbers.reduce((a, b) => a + b, 0);
        const count = numbers.length;
        const avg = count ? (sum / count) : 0;
        document.getElementById('statCount').innerText = count;
        document.getElementById('statSum').innerText = sum.toFixed(2).replace(/\.00$/, '');
        document.getElementById('statAvg').innerText = avg.toFixed(2).replace(/\.00$/, '');
    }
</script>
</body>
</html>
