<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QC Toolset Pro</title>
    
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1162/1162456.png">
    
    <link rel="manifest" id="pwa-manifest">

    <style>
        :root { 
            --primary: #2563eb; 
            --primary-hover: #1d4ed8; 
            --bg: #f3f4f6; 
            --card-bg: #ffffff; 
            --text: #1f2937; 
            --border: #e5e7eb; 
            --accent: #d97706; 
            --success: #10b981;
        }
        
        body { 
            overscroll-behavior-y: contain; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .container { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 20px; padding-bottom: 50px; }
        .card { background-color: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 1.25rem; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .row { display: flex; gap: 15px; } .row .input-group { flex: 1; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 0.875rem; }
        input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; width: 100%; box-sizing: border-box; }
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
        button:hover { background-color: var(--primary-hover); }
        button.secondary { background-color: #ef4444; width: 100%; margin-top: 10px; }
        
        /* New Alarm Button Style */
        .btn-alarm { background-color: #8b5cf6; margin-top: 8px; font-size: 0.9rem; }
        .btn-alarm:hover { background-color: #7c3aed; }
        
        .result { margin-top: 15px; padding: 15px; background-color: #f8fafc; border-radius: 8px; border: 1px solid var(--border); font-size: 1.1rem; text-align: center; }
        .glaze-pct { color: var(--accent); font-weight: 800; font-size: 1.3rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 15px 0; text-align: center; }
        .stat-box { background-color: #f8fafc; border: 1px solid var(--border); padding: 10px; border-radius: 8px; }
        .stat-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; font-weight: bold; }
        .stat-value { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        .drag-container { display: none; flex-direction: column; gap: 8px; margin: 15px 0; max-height: 350px; overflow-y: auto; border-radius: 8px; padding: 4px; }
        .number-item { display: flex; align-items: center; background: #fff; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; gap: 10px; transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1); -webkit-user-select: none; user-select: none; }
        .number-item.dragging { opacity: 0.4; }
        .drag-handle { color: #94a3b8; cursor: grab; display: flex; align-items: center; justify-content: center; padding: 5px 10px; touch-action: none; -webkit-touch-callout: none; }
        .edit-input { flex: 1; border: 1px solid transparent; background: transparent; font-weight: 600; padding: 4px; font-size: 1rem; }
        .remove-btn { background: #fee2e2; color: #ef4444; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .last-added-text { font-size: 0.85rem; color: var(--success); font-weight: 600; margin-top: 5px; height: 1.2em; }
        .btn-recursive { background-color: var(--success); margin-top: 12px; font-size: 0.95rem; padding: 10px; }
        @media (max-width: 480px) { .row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>

<div class="container">
    <!-- Sampling Time Card -->
    <div class="card">
        <h2>Sampling Time</h2>
        <div class="row">
            <div class="input-group">
                <label>Min Mins</label>
                <input type="number" id="minMinutes" value="40" inputmode="numeric">
            </div>
            <div class="input-group">
                <label>Max Mins</label>
                <input type="number" id="maxMinutes" value="60" inputmode="numeric">
            </div>
        </div>
        <div class="input-group"><label>Start Time</label><input type="time" id="startTime"></div>
        <button onclick="generateTime(false)">Generate Sampling Time</button>
        <button id="clearTimeBtn" class="secondary" onclick="resetSamplingTime()" style="display: none;">Clear</button>
        <div class="result" id="timeResult" style="display: none;"></div>
    </div>

    <!-- Glaze Calculator Card -->
    <div class="card">
        <h2>Glaze Calculator</h2>
        <div class="row">
            <div class="input-group"><label>Glazed</label><input type="number" step="any" id="glazedVal" inputmode="decimal"></div>
            <div class="input-group"><label>Deglazed</label><input type="number" step="any" id="deglazeVal" inputmode="decimal"></div>
        </div>
        <button onclick="calculateGlaze()">Calculate Glaze</button>
        <button id="clearGlazeBtn" class="secondary" onclick="resetGlaze()" style="display: none;">Clear</button>
        <div class="result" id="glazeResult" style="display: none;"></div>
    </div>

    <!-- Averaging Card -->
    <div class="card">
        <h2>Averaging & Sum</h2>
        <div class="stats-grid">
            <div class="stat-box"><div class="stat-label">Count</div><div class="stat-value" id="statCount">0</div></div>
            <div class="stat-box"><div class="stat-label">Sum</div><div class="stat-value" id="statSum">0</div></div>
            <div class="stat-box"><div class="stat-label">Avg</div><div class="stat-value" id="statAvg">0</div></div>
        </div>
        <div class="input-group">
            <label>Add Number</label>
            <div style="display: flex; gap: 10px;">
                <input type="number" step="any" id="numberInput" inputmode="decimal" placeholder="0.00" onkeypress="if(event.key==='Enter')addNumber()">
                <button onmousedown="event.preventDefault()" onclick="addNumber()" style="width: auto;">Add</button>
            </div>
            <div class="last-added-text" id="lastAddedDisplay"></div>
        </div>
        <div id="numberList" class="drag-container"></div>
        <button id="clearAllBtn" class="secondary" onclick="clearNumbers()" style="display:none;">Clear All</button>
    </div>

    <!-- Salinity Card -->
    <div class="card">
        <h2>Salinity Calculator</h2>
        <div class="input-group">
            <label>Brix Value</label>
            <input type="number" step="any" id="brixVal" inputmode="decimal" placeholder="Enter Brix">
        </div>
        <button onclick="calculateSalinity()">Calculate Salinity</button>
        <button id="clearSalinityBtn" class="secondary" onclick="resetSalinity()" style="display: none;">Clear</button>
        <div class="result" id="salinityResult" style="display: none;"></div>
    </div>
</div>

<script>
    /* PWA & SERVICE WORKER LOGIC */
    const manifest = {
        "name": "QC Toolset Pro",
        "short_name": "QC Tool",
        "start_url": ".",
        "display": "standalone",
        "background_color": "#f3f4f6",
        "theme_color": "#2563eb",
        "icons": [{
            "src": "https://cdn-icons-png.flaticon.com/512/1162/1162456.png",
            "sizes": "512x512",
            "type": "image/png",
            "purpose": "any maskable"
        }]
    };
    document.querySelector('#pwa-manifest').setAttribute('href', URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'})));

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swCode = `
                const CACHE_NAME = 'qc-tool-v4';
                const APP_URL = location.origin + location.pathname;
                self.addEventListener('install', (event) => {
                    event.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(['./', APP_URL])));
                    self.skipWaiting();
                });
                self.addEventListener('activate', (event) => {
                    event.waitUntil(caches.keys().then((keys) => Promise.all(
                        keys.map((key) => { if (key !== CACHE_NAME) return caches.delete(key); })
                    )).then(() => self.clients.claim()));
                });
                self.addEventListener('fetch', (event) => {
                    event.respondWith(caches.match(event.request).then((cached) => cached || fetch(event.request)));
                });
            `;
            const blob = new Blob([swCode], {type: 'text/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob)).then(reg => reg.update());
        });
    }

    /* APP LOGIC */
    let lastGeneratedTimeStr = "";

    function generateTime(isRecursive) {
        const minStr = document.getElementById('minMinutes').value || "40";
        const maxStr = document.getElementById('maxMinutes').value || "60";
        let startStr = document.getElementById('startTime').value;
        const res = document.getElementById('timeResult');
        
        if (isRecursive) { startStr = lastGeneratedTimeStr; } 
        else if (!startStr) { res.style.display="block"; res.innerHTML='<span style="color:red">Select Start Time</span>'; return; }
        
        const min=parseInt(minStr); const max=parseInt(maxStr);
        const rand=Math.floor(Math.random()*(max-min+1))+min;
        const [h,m]=startStr.split(':').map(Number);
        const total=(h*60+m+rand)%1440;
        lastGeneratedTimeStr=`${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
        
        res.style.display="block";
        res.innerHTML = `
            <div style="font-size:0.85rem;color:#64748b;">Start: ${startStr} (+${rand}m)</div>
            <div style="font-weight:bold;color:var(--primary);font-size:1.4rem;">Result: ${lastGeneratedTimeStr}</div>
            <div style="display: flex; flex-direction: column; gap: 5px; margin-top: 10px;">
                <button class="btn-alarm" onclick="setSystemAlarm('${lastGeneratedTimeStr}')">⏰ Set Alarm</button>
                <button class="btn-recursive" onclick="generateTime(true)">Next from ${lastGeneratedTimeStr}</button>
            </div>
        `;
        document.getElementById('clearTimeBtn').style.display = 'block';
    }

    function setSystemAlarm(timeStr) {
        const [hour, minute] = timeStr.split(':');
        const message = "Sampling Time";
        
        // Android Intent for Alarm Clock
        const intentUrl = `intent://android.intent.action.SET_ALARM#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${parseInt(hour)};i.android.intent.extra.alarm.MINUTES=${parseInt(minute)};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(message)};i.android.intent.extra.alarm.SKIP_UI=false;end`;
        
        try {
            window.location.href = intentUrl;
            // Fallback for non-Android: Copy to clipboard
            setTimeout(() => {
                if (document.hasFocus()) {
                    navigator.clipboard.writeText(timeStr);
                    alert(`Alarm screen requested. Time ${timeStr} also copied to clipboard.`);
                }
            }, 500);
        } catch (e) {
            navigator.clipboard.writeText(timeStr);
            alert(`Time ${timeStr} copied to clipboard.`);
        }
    }

    function resetSamplingTime() {
        document.getElementById('startTime').value = '';
        const res = document.getElementById('timeResult');
        res.style.display = 'none';
        res.innerHTML = '';
        lastGeneratedTimeStr = "";
        document.getElementById('clearTimeBtn').style.display = 'none';
    }

    function calculateGlaze() {
        const g=parseFloat(document.getElementById('glazedVal').value);
        const d=parseFloat(document.getElementById('deglazeVal').value);
        if(!g||!d) return;
        const dec=(g-d)/g;
        const res=document.getElementById('glazeResult');
        res.style.display="block";
        res.innerHTML=`Decimal: <strong>${dec.toFixed(4)}</strong> | <span class="glaze-pct">${(dec * 100).toFixed(2)}%</span>`;
        document.getElementById('clearGlazeBtn').style.display = 'block';
    }

    function resetGlaze() {
        document.getElementById('glazedVal').value = '';
        document.getElementById('deglazeVal').value = '';
        document.getElementById('glazeResult').style.display = 'none';
        document.getElementById('clearGlazeBtn').style.display = 'none';
    }

    let numbers = [];
    function addNumber() {
        const inp=document.getElementById('numberInput');
        const val=parseFloat(inp.value); if(isNaN(val)) return;
        document.getElementById('lastAddedDisplay').innerText=`Last added: ${val}`;
        numbers.push(val);
        inp.value=''; renderList();
        const container = document.getElementById('numberList');
        container.scrollTop = container.scrollHeight;
    }

    function removeNumber(i){numbers.splice(i,1); renderList();}
    function clearNumbers(){ numbers=[]; document.getElementById('lastAddedDisplay').innerText=''; renderList(); }
    function updateVal(i,v){numbers[i]=parseFloat(v)||0; updateStats();}

    function renderList() {
        const container = document.getElementById('numberList');
        const clearBtn = document.getElementById('clearAllBtn');
        container.innerHTML = '';
        if(numbers.length === 0) { container.style.display = "none"; clearBtn.style.display = "none"; } 
        else { container.style.display = "flex"; clearBtn.style.display = "block"; }

        const svgIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>`;

        numbers.forEach((n, i) => {
            const div = document.createElement('div');
            div.className = 'number-item';
            div.draggable = true;
            div.innerHTML = `<span class="drag-handle">${svgIcon}</span><input type="number" class="edit-input" value="${n}" onchange="updateVal(${i}, this.value)" inputmode="decimal"><button class="remove-btn" onclick="removeNumber(${i})">&times;</button>`;
            div.addEventListener('dragstart', () => div.classList.add('dragging'));
            div.addEventListener('dragend', () => {
                div.classList.remove('dragging');
                numbers = [...container.querySelectorAll('.edit-input')].map(input => parseFloat(input.value) || 0);
                updateStats();
            });
            container.appendChild(div);
        });

        container.addEventListener('dragover', e => {
            e.preventDefault();
            const dragging = document.querySelector('.dragging');
            if(!dragging) return;
            const afterElement = getDragAfterElement(container, e.clientY);
            if (afterElement == null) container.appendChild(dragging);
            else container.insertBefore(dragging, afterElement);
        });
        updateStats();
    }

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.number-item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
            else return closest;
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function updateStats() {
        const sum = numbers.reduce((a, b) => a + b, 0);
        document.getElementById('statCount').innerText = numbers.length;
        document.getElementById('statSum').innerText = sum.toFixed(2).replace(/\.00$/, '');
        const avg = numbers.length ? (sum / numbers.length) : 0;
        document.getElementById('statAvg').innerText = avg.toFixed(2).replace(/\.00$/, '');
    }

    function calculateSalinity() {
        const brix = parseFloat(document.getElementById('brixVal').value);
        if (isNaN(brix)) return;
        const res = document.getElementById('salinityResult');
        res.style.display = "block";
        res.innerHTML = `Salinity: <strong>${((brix / 26.4) * 100).toFixed(2)}%</strong>`;
        document.getElementById('clearSalinityBtn').style.display = 'block';
    }

    function resetSalinity() {
        document.getElementById('brixVal').value = '';
        document.getElementById('salinityResult').style.display = 'none';
        document.getElementById('clearSalinityBtn').style.display = 'none';
    }
</script>
</body>
</html>
